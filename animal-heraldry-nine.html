<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e7e3da">
  <title>三兽纹章 · 九案</title>
  <link rel="stylesheet" href="/src/fonts/faction-song.css">
  <link rel="stylesheet" href="/src/animal-heraldry-nine.css">
</head>
<body>
  <main class="page">
    <header>
      <div><p class="eyebrow">CELESTIAN / ARMORIAL STUDIES</p><h1>三兽纹章 <span>·</span> 九案</h1></div>
      <a href="/imperial-knights.html">返回五旗页面 ↗</a>
    </header>
    <div class="toolbar">
      <div class="tabs" role="group" aria-label="选择动物组">
        <button data-group="bear" aria-pressed="true">熊 <small>B1—B3</small></button>
        <button data-group="lynx" aria-pressed="false">猞猁 <small>L1—L3</small></button>
        <button data-group="wolf" aria-pressed="false">狼 <small>W1—W3</small></button>
        <button data-group="all" aria-pressed="false">九案总览</button>
      </div>
      <button class="field-toggle" aria-pressed="true">查看素底</button>
    </div>
    <section class="intro" aria-live="polite"><h2 id="group-title">熊 · 古林与堡垒</h2><p id="group-description">厚重的轮廓、圆耳与钝吻，以古典纹章姿态表现山地守卫。</p></section>
    <section id="board" class="board" aria-label="动物纹章候选对比"></section>
    <footer><span>独立透明图层 · 银白古典纹章 · 分团无冠冕</span><span>点击图案放大　／　直接用 B、L、W 编号选案</span></footer>
  </main>
  <dialog aria-labelledby="detail-title">
    <div class="dialog-head"><div><p class="eyebrow" id="detail-group"></p><h2 id="detail-title"></h2></div><button class="close" aria-label="关闭大图">×</button></div>
    <div class="detail-art"><img id="detail-image" alt=""></div>
    <div class="dialog-foot"><p id="detail-description"></p><a id="download" download>下载透明原图 ↓</a></div>
  </dialog>
  <script type="module" src="/src/animal-heraldry-nine.js"></script>
</body>
</html>
