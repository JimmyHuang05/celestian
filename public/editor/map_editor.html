                document.getElementById('map-desc').value = '';
                window.setModalDropdown('城市');
                
                currentColor = '#d4b58e';
                if (latlng) tempLatLng = latlng;
                titleEl.innerHTML = `<i data-lucide="crosshair" class="w-5 h-5 text-[#d4b58e] inline-block mb-1"></i> 确立战术坐标`;
            }
            
            document.getElementById('map-color-picker').value = currentColor;
            document.getElementById('map-color-hex').value = currentColor.toUpperCase();

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            lucide.createIcons({ root: titleEl });
            if(!id) document.getElementById('map-title').focus();
        }

        window.cancelMapMarker = function() {
            document.getElementById('map-modal').classList.add('hidden');
            document.getElementById('map-modal').classList.remove('flex');
            tempLatLng = null;
        }

        async function saveMapMarker() {
            const id = document.getElementById('map-edit-id').value;
            const title = document.getElementById('map-title').value.trim();
            if(!title) return showToast('必须填写中文标识', true);
            
            const btn = document.getElementById('map-save-btn');
            btn.disabled = true; btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> 烧录中...';

            const payload = { 
                title: title, foreign_title: document.getElementById('map-foreign-title').value.trim(),
                type: document.getElementById('map-type').value, description: document.getElementById('map-desc').value.trim(),
                icon: 'geo', color: currentColor
            };

            if (!id && tempLatLng) {
                payload.lat = tempLatLng.lat;
                payload.lng = tempLatLng.lng;
            }

            try {
                const res = id ? await supabaseClient.from('map_markers').update(payload).eq('id', id) : await supabaseClient.from('map_markers').insert([payload]);
                if (res.error) throw res.error;
                showToast(id ? '节点数据已更新' : '节点创建成功');
                cancelMapMarker();
                fetchAdminMapMarkers(); 
            } catch (e) { showToast('操作失败，请确认数据库状态', true); } 
            finally { 
                btn.disabled = false; 
                btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg> 保存并锚定'; 
            }
        }

        async function deleteMapMarker(id) {
            if (!confirm('警告：删除此节点将导致相关数据永久丢失。是否继续？')) return;
            try {
                const { error } = await supabaseClient.from('map_markers').delete().eq('id', id);
                if (error) throw error;
                showToast('已删除节点');
                if(adminMap) adminMap.closePopup(); 
                fetchAdminMapMarkers(); 
            } catch (err) { showToast('删除失败', true); }
        }

        async function fetchAdminMapMarkers() {
            if (currentMode === 'marker') document.getElementById('map-marker-list').innerHTML = '<div class="text-center py-10 text-gray-400 text-sm animate-pulse font-serif-sc">Scanning Grid...</div>';
            try {
                const { data, error } = await supabaseClient.from('map_markers').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                allMapMarkers = data || [];
                if (currentMode === 'marker') renderAdminMapMarkers();
            } catch (e) { document.getElementById('map-marker-list').innerHTML = '<div class="text-center py-10 text-red-500 text-sm font-serif-sc">同步异常</div>'; }
        }

        function handleAdminFilter() {
            adminSearchQuery = document.getElementById('admin-search-input').value.toLowerCase();
            if (currentMode === 'marker') {
                renderAdminMapMarkers();
            } else {
                renderAdminRegionList();
            }
        }

        window.activateMoveMode = function(id) {
            movingMarkerId = id;
            adminMap.closePopup();
            document.getElementById('admin-map-container').classList.add('move-mode');
            showToast('节点已锁定：请点击地图上的新位置（按Esc取消）');
        }

        function locateMarker(id) {
            const marker = allMapMarkers.find(m => m.id === id);
            if(marker && adminMap) {
                adminMap.flyTo([marker.lat, marker.lng], 0, { duration: 1.0 });
                const layers = mapMarkersLayer.getLayers();
                const targetLayer = layers.find(l => l.getLatLng().lat === marker.lat && l.getLatLng().lng === marker.lng);
                if(targetLayer) {
                    setTimeout(() => targetLayer.openPopup(), 1000);
                }
            }
        }

        function renderAdminMapMarkers() {
            const listContainer = document.getElementById('map-marker-list');
            mapMarkersLayer.clearLayers();

            let filtered = allMapMarkers.filter(m => {
                const searchMatch = (m.title && m.title.toLowerCase().includes(adminSearchQuery)) || 
                                    (m.foreign_title && m.foreign_title.toLowerCase().includes(adminSearchQuery)) || 
                                    (m.description && m.description.toLowerCase().includes(adminSearchQuery));
                const typeMatch = adminFilterType === '' || m.type === adminFilterType;
                return searchMatch && typeMatch;
            });

            filtered.sort((a, b) => {
                let nameA = (a.foreign_title || a.title || '').toLowerCase();
                let nameB = (b.foreign_title || b.title || '').toLowerCase();
                return nameA.localeCompare(nameB, 'en');
            });

            document.getElementById('admin-marker-count').innerText = `TOTAL: ${filtered.length}`;

            if (filtered.length === 0) {
                listContainer.innerHTML = '<div class="text-center py-10 text-gray-400 text-sm font-serif-sc">暂无匹配的坐标档案</div>';
                return;
            }

            let listHtml = '';
            filtered.forEach(marker => {
                const iconColor = marker.color || '#d4b58e';
                const markerType = marker.type || '城市';
                
                const mapSvg = getGeoSvg(markerType, iconColor, 32);
                const listSvg = getGeoSvg(markerType, iconColor, 20);

                const mIcon = L.divIcon({
                    className: 'geo-pin',
                    html: `<div style="filter: drop-shadow(0 3px 4px rgba(0,0,0,0.8));">${mapSvg}</div>`,
                    iconSize: [32, 32], iconAnchor: [16, 16], popupAnchor: [0, -16]
                });

                const m = L.marker([marker.lat, marker.lng], { icon: mIcon }).addTo(mapMarkersLayer);
                
                const popupHTML = `
                    <div class="p-1 min-w-[180px]">
                        <h4 class="font-bold text-base mb-1.5 border-b pb-1.5 flex flex-col gap-0.5" style="color:${iconColor}; border-color:${iconColor}50;">
                            <span class="leading-none">${marker.title}</span>
                            ${marker.foreign_title ? `<span class="text-[10px] font-mono uppercase tracking-wider opacity-70 leading-none">${marker.foreign_title}</span>` : ''}
                        </h4>
                        <p class="text-gray-300 text-xs font-serif-sc leading-relaxed mb-2.5">${marker.description || '无摘要'}</p>
                        
                        <div class="flex items-center gap-2 pt-2 border-t border-[#d4b58e]/20">
                            <button onclick="openMarkerModal('${marker.id}')" class="flex-1 flex items-center justify-center gap-1 py-1 bg-[#d4b58e]/10 text-[#d4b58e] border border-[#d4b58e]/30 hover:bg-[#d4b58e]/20 rounded text-[11px] transition-colors">
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg> 
                                编辑
                            </button>
                            <button onclick="activateMoveMode('${marker.id}')" class="flex-1 flex items-center justify-center gap-1 py-1 bg-blue-500/10 text-blue-400 border border-blue-500/30 hover:bg-blue-500/20 rounded text-[11px] transition-colors">
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 2 12 5 15"></polyline><polyline points="9 5 12 2 15 5"></polyline><polyline points="19 9 22 12 19 15"></polyline><polyline points="9 19 12 22 15 19"></polyline><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line></svg>
                                移动
                            </button>
                        </div>
                    </div>
                `;
                m.bindPopup(popupHTML, { className: 'custom-popup', autoPan: false });

                listHtml += `
                    <div class="bg-white border border-[#e5e7eb] rounded-xl p-4 shadow-sm flex items-center justify-between group transition-all hover:border-[${iconColor}]/40 hover:shadow-md cursor-pointer" onclick="locateMarker('${marker.id}')">
                        <div class="flex items-center gap-4 flex-1 min-w-0 pointer-events-none">
                            <div class="w-12 h-12 bg-gray-50 border border-gray-100 rounded-lg flex items-center justify-center shrink-0 transition-colors shadow-inner">
                                ${listSvg}
                            </div>
                            <div class="flex flex-col justify-center flex-1 min-w-0">
                                <div class="flex items-center gap-2 mb-1">
                                    <h4 class="font-bold text-gray-800 text-[15px] font-serif-sc truncate leading-none">${marker.title}</h4>
                                    <span class="text-[10px] px-1.5 py-0.5 bg-gray-100 text-gray-500 rounded border border-gray-200 font-mono shrink-0">${markerType}</span>
                                </div>
                                <p class="text-[11px] text-gray-400 font-mono tracking-widest uppercase leading-none">
                                    ${marker.foreign_title ? `<span class="mr-2">${marker.foreign_title}</span>` : ''}
                                    <span class="opacity-70">X: ${Math.round(marker.lng)}, Y: ${Math.round(marker.lat)}</span>
                                </p>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1 shrink-0 ml-4 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="event.stopPropagation(); openMarkerModal('${marker.id}')" class="p-1.5 text-blue-500 hover:text-blue-700 hover:bg-blue-50 rounded transition-colors" title="重新编辑">
                                <i data-lucide="edit-3" class="w-4 h-4"></i>
                            </button>
                            <button onclick="event.stopPropagation(); deleteMapMarker('${marker.id}')" class="p-1.5 text-red-500 hover:text-red-700 hover:bg-red-50 rounded transition-colors" title="抹除坐标">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            listContainer.innerHTML = listHtml;
            lucide.createIcons({ root: listContainer }); 
        }
    </script>
</body>
</html>
