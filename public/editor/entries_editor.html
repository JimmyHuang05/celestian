<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>「百科全书」编辑器丨开发者中心</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+SC:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    [v-cloak] { display: none !important; }

    body {
      margin: 0; padding: 0; background-color: #f8f9fa; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    
    .font-serif-sc { font-family: 'Noto Serif SC', serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }

    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #d1d5db; }

    .dark-scrollbar::-webkit-scrollbar { width: 4px; }
    .dark-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .dark-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .dark-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .extreme-dark-scrollbar::-webkit-scrollbar { width: 4px; }
    .extreme-dark-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .extreme-dark-scrollbar::-webkit-scrollbar-thumb { background: rgba(212,181,142,0.2); border-radius: 4px; }
    .extreme-dark-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(212,181,142,0.4); }

    .slider-thumb-style::-webkit-slider-thumb {
        appearance: none; width: 14px; height: 14px; border-radius: 50%;
        background: #d4b58e; cursor: pointer; transition: transform 0.1s, background 0.1s;
        box-shadow: 0 0 8px rgba(212,181,142,0.5);
    }
    .slider-thumb-style::-webkit-slider-thumb:hover { transform: scale(1.3); background: #c2a27b; }

    #floating-toolbar { transition: opacity 0.15s ease, transform 0.15s ease; transform-origin: bottom center; }
    #floating-toolbar.active { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
    #floating-toolbar.inactive { opacity: 0; transform: translate(-50%, 10px) scale(0.95); pointer-events: none; }
    
    input[type="number"]::-webkit-inner-spin-button, 
    input[type="number"]::-webkit-outer-spin-button { 
        -webkit-appearance: none; margin: 0; 
    }

    @keyframes spin-slow {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes spin-slow-reverse {
      from { transform: translate(-50%, -50%) rotate(360deg); }
      to { transform: translate(-50%, -50%) rotate(0deg); }
    }
    .halo-ring-1 { animation: spin-slow 40s linear infinite; }
    .halo-ring-2 { animation: spin-slow-reverse 60s linear infinite; }

    @keyframes shrine-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    .animate-shrine { animation: shrine-float 10s ease-in-out infinite; }

    .has-drop-cap::first-letter {
      float: left; font-size: 4rem; line-height: 0.8;
      padding-top: 0.2rem; padding-right: 0.6rem; color: #d4b58e;
      font-family: 'Cinzel', serif; font-weight: 500; text-shadow: 0 0 20px rgba(212, 181, 142, 0.4);
    }

    .has-drop-cap {
      text-indent: 0 !important;
    }
    
    .arch-window { border-radius: 500px 500px 12px 12px; }
  </style>
</head>
<body>
  <div id="app" v-cloak class="w-screen h-screen flex flex-col bg-[#f8f9fa] overflow-hidden">
    
    <!-- 顶栏：系统级始终亮色 -->
    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 shrink-0 shadow-sm relative z-[200]">
        <div class="flex items-center gap-4">
            <a href="index.html" class="w-8 h-8 rounded bg-[#d4b58e]/10 border border-[#d4b58e]/30 flex items-center justify-center text-[#d4b58e] hover:bg-[#d4b58e] hover:text-white transition-all shadow-sm shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
            </a>
            
            <h1 class="font-black text-xl flex items-center gap-2 font-serif-sc tracking-wide shrink-0 text-gray-800">
                「百科全书」编辑器 <span class="font-mono text-sm font-normal hidden sm:inline text-gray-300">| ENTRIES ARCHIVE</span>
            </h1>
            
            <div class="ml-4 flex items-center rounded-full p-1 border overflow-x-auto custom-scrollbar whitespace-nowrap bg-gray-50 border-gray-200">
                <button v-for="n in nodesDict" :key="n.id" @click="currentEntry.node_id = n.id" 
                        :class="currentEntry.node_id === n.id ? 'bg-[#d4b58e]/10 text-[#d4b58e] border border-[#d4b58e]/30 shadow-sm' : 'text-gray-500 hover:text-gray-700 hover:bg-gray-100 border border-transparent'"
                        class="px-4 py-1 text-xs font-bold rounded-full transition-all tracking-wider shrink-0 flex items-center gap-1">
                    {{ n.title }}
                </button>
            </div>
        </div>
        
        <div class="flex items-center gap-3 shrink-0">
            <!-- 搜索 -->
            <div class="relative w-56 z-[300]">
                <div class="flex items-center border rounded-lg overflow-hidden transition-all relative shadow-inner bg-white border-gray-300 focus-within:border-[#d4b58e] focus-within:ring-2 focus-within:ring-[#d4b58e]/10">
                    <i data-lucide="search" class="w-3.5 h-3.5 ml-2.5 shrink-0 transition-colors text-gray-400"></i>
                    <input v-model="searchQuery" @focus="isSearchDropdownOpen = true" @blur="closeSearchDropdown" type="text" placeholder="搜索并加载词条..." 
                           class="bg-transparent font-bold font-serif-sc text-xs w-full p-2 outline-none transition-colors text-gray-800 placeholder-gray-400">
                    
                    <button v-show="searchQuery" @click="searchQuery = ''; isSearchDropdownOpen = true" class="p-1 mr-1 focus:outline-none transition-colors text-gray-400 hover:text-gray-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                </div>
                
                <transition name="fade">
                    <div v-show="isSearchDropdownOpen" class="absolute top-full right-0 w-64 mt-2 border rounded-xl shadow-xl z-[300] overflow-hidden flex flex-col bg-white border-gray-100">
                        <div class="max-h-60 overflow-y-auto py-1 dark-scrollbar">
                            <div v-if="filteredRecords.length === 0" class="px-4 py-3 text-center text-xs italic text-gray-400">
                                未找到相关词条
                            </div>
                            <div v-for="record in filteredRecords" :key="record.id"
                                 @mousedown.prevent="selectRecord(record.id)"
                                 class="px-3 py-2 text-xs cursor-pointer transition-colors truncate flex flex-col gap-0.5 group text-gray-700 hover:bg-gray-50 hover:text-[#d4b58e]">
                                <span class="font-bold group-hover:text-[#d4b58e] font-serif-sc text-[13px]">{{ record.title }}</span>
                                <span class="text-[10px] font-mono tracking-widest transition-colors text-gray-400">{{ record.node_id.toUpperCase() }}</span>
                            </div>
                        </div>
                    </div>
                </transition>
            </div>
            
            <div class="h-4 w-px mx-1 bg-gray-300"></div>
            
            <button @click="createNew" class="px-4 py-1.5 text-xs font-bold rounded-lg flex items-center gap-1.5 transition-colors shadow-sm shrink-0 border bg-white border-gray-300 text-gray-600 hover:border-[#d4b58e] hover:text-[#d4b58e]">
                <i data-lucide="file-plus" class="w-3.5 h-3.5"></i> 新建空白词条
            </button>
            <button @click="promptDelete" :disabled="!currentEntry.id" class="px-4 py-1.5 text-xs font-bold rounded-lg flex items-center gap-1.5 transition-colors disabled:opacity-50 disabled:cursor-not-allowed shrink-0 border bg-red-50 border-red-200 text-red-500 hover:bg-red-100">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> 删除词条
            </button>
            
            <button @click="save" :disabled="isSaving" class="px-5 py-1.5 text-xs bg-[#d4b58e] text-white rounded-lg font-bold hover:bg-[#c2a27b] flex items-center gap-2 shadow-md transition-all disabled:opacity-50 shrink-0">
                <svg v-if="!isSaving" xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>
                <svg v-else xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                {{ isSaving ? '上传中...' : '同步至数据库' }}
            </button>
        </div>
    </header>

    <!-- 下方主体 -->
    <div class="flex-1 flex flex-row overflow-hidden relative z-10">
        <!-- 侧边栏：系统级始终亮色 -->
        <aside class="w-20 h-full flex flex-col items-center py-5 gap-5 shrink-0 z-[500] shadow-[4px_0_24px_rgba(0,0,0,0.03)] border-r relative bg-white border-gray-200">
            <a href="entries_editor.html" class="w-10 h-10 shrink-0 rounded-xl flex items-center justify-center transition-all bg-[#d4b58e] text-white shadow-md pointer-events-none" title="百科全书编辑器">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>
            </a>
            <a href="map_editor.html" class="w-10 h-10 shrink-0 rounded-xl flex items-center justify-center transition-all border bg-gray-50 border-gray-200 text-gray-400 hover:bg-gray-100 hover:text-[#d4b58e]" title="海陆图志编辑器">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" x2="9" y1="3" y2="21"/><line x1="15" x2="15" y1="3" y2="21"/></svg>
            </a>

            <div class="w-6 h-px rounded-full shrink-0 bg-gray-200"></div>

            <a href="svg_editor.html" class="w-10 h-10 shrink-0 rounded-xl flex items-center justify-center transition-all border bg-gray-50 border-gray-200 text-gray-400 hover:bg-gray-100 hover:text-[#d4b58e]" title="矢量测绘工具">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
            </a>

            <div class="mt-auto flex flex-col gap-5 w-full items-center">
                <a href="https://www.photopea.com/" target="_blank" class="w-10 h-10 shrink-0 rounded-lg overflow-hidden border transition-all opacity-70 hover:opacity-100 flex items-center justify-center bg-gray-50 border-gray-200 hover:border-[#d4b58e]">
                    <img src="https://www.google.com/s2/favicons?sz=64&domain=photopea.com" class="w-5 h-5 object-contain">
                </a>
                <a href="https://squoosh.app/" target="_blank" class="w-10 h-10 shrink-0 rounded-lg overflow-hidden border transition-all opacity-70 hover:opacity-100 flex items-center justify-center bg-gray-50 border-gray-200 hover:border-[#d4b58e]">
                    <img src="https://www.google.com/s2/favicons?sz=64&domain=squoosh.app" class="w-5 h-5 object-contain">
                </a>
                <a href="https://tinypng.com/" target="_blank" class="w-10 h-10 shrink-0 rounded-lg overflow-hidden border transition-all opacity-70 hover:opacity-100 flex items-center justify-center bg-gray-50 border-gray-200 hover:border-[#d4b58e]">
                    <img src="https://www.google.com/s2/favicons?sz=64&domain=tinypng.com" class="w-5 h-5 object-contain rounded-sm">
                </a>
                <a href="https://www.remove.bg/" target="_blank" class="w-10 h-10 shrink-0 rounded-lg overflow-hidden border transition-all opacity-70 hover:opacity-100 flex items-center justify-center bg-gray-50 border-gray-200 hover:border-[#d4b58e]">
                    <img src="https://www.google.com/s2/favicons?sz=64&domain=remove.bg" class="w-5 h-5 object-contain rounded-sm">
                </a>
            </div>
        </aside>

        <!-- 编辑器主区域 -->
        <div class="flex-1 flex items-center justify-center p-4 relative z-10 overflow-hidden bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] bg-opacity-20">

            <!-- ================= 标准亮色分栏编辑器 (!isDarkStyle) ================= -->
            <div v-if="!isDarkStyle" class="relative w-11/12 md:w-10/12 max-w-5xl h-[80vh] md:h-[75vh] bg-white text-gray-800 rounded-2xl shadow-xl flex flex-col md:flex-row p-4 md:p-6 gap-4 md:gap-8 pointer-events-auto z-10 border border-gray-200 transition-opacity duration-300">
                
                <!-- 左侧：塔罗牌画框 -->
                <div class="w-full md:w-1/3 flex-shrink-0 h-[40%] md:h-full relative z-[100] flex items-center justify-center group/portrait pointer-events-none bg-gray-50/50 rounded-xl">
                    <div class="absolute inset-0 bg-transparent rounded-xl border-[2px] border-[#d4b58e]/30 flex items-center justify-center overflow-hidden pointer-events-none">
                        <div class="absolute inset-1.5 border border-[#d4b58e]/20 rounded-lg pointer-events-none"></div>
                        <svg class="absolute top-0 left-0 w-6 h-6 text-[#d4b58e]/60 -translate-x-1 -translate-y-1" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0L14 10L24 12L14 14L12 24L10 14L0 12L10 10Z"/></svg>
                        <svg class="absolute top-0 right-0 w-6 h-6 text-[#d4b58e]/60 translate-x-1 -translate-y-1" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0L14 10L24 12L14 14L12 24L10 14L0 12L10 10Z"/></svg>
                        <svg class="absolute bottom-0 left-0 w-6 h-6 text-[#d4b58e]/60 -translate-x-1 translate-y-1" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0L14 10L24 12L14 14L12 24L10 14L0 12L10 10Z"/></svg>
                        <svg class="absolute bottom-0 right-0 w-6 h-6 text-[#d4b58e]/60 translate-x-1 translate-y-1" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0L14 10L24 12L14 14L12 24L10 14L0 12L10 10Z"/></svg>
                        <img v-if="currentEntry.bg_image_url" :src="currentEntry.bg_image_url" :style="{ width: (currentEntry.bg_image_scale || 120) + '%', height: (currentEntry.bg_image_scale || 120) + '%' }" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 object-cover opacity-60 mix-blend-multiply transition-all duration-300 pointer-events-none z-10" />
                    </div>

                    <div class="absolute inset-0 flex items-center justify-center z-[300] pointer-events-none">
                        <div v-if="currentEntry.image_url" class="relative pointer-events-auto flex-shrink-0 transition-transform duration-300 hover:scale-[1.03]" :style="{ width: (currentEntry.main_image_scale || 100) + '%' }">
                            <img :src="currentEntry.image_url" class="w-full h-auto max-w-none object-contain drop-shadow-[0_20px_40px_rgba(0,0,0,0.15)] block" draggable="false" />
                            <div class="absolute inset-0 z-10 bg-transparent" @contextmenu.prevent></div>
                        </div>
                        <div v-else-if="!currentEntry.bg_image_url" class="flex flex-col items-center text-[#d4b58e] opacity-50 z-20 pointer-events-none">
                           <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 mb-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                           <span class="text-sm font-mono tracking-widest text-center font-bold">悬停配置立绘</span>
                        </div>
                    </div>

                    <div class="absolute inset-0 bg-white/70 backdrop-blur-sm opacity-0 group-hover/portrait:opacity-100 transition-opacity z-[400] flex flex-col items-center justify-center p-4 rounded-xl pointer-events-auto shadow-inner border border-gray-200">
                        <div class="bg-white p-5 rounded-2xl shadow-xl w-full max-w-sm flex flex-col gap-3 border border-gray-100 custom-scrollbar overflow-y-auto max-h-[90%]">
                            <div class="text-center font-bold text-gray-800 text-sm tracking-widest border-b border-gray-100 pb-2 mb-1 font-mono">PORTRAIT VISUAL</div>
                            <div class="bg-gray-50/50 p-2 rounded border border-gray-100">
                                <label class="text-[10px] font-bold text-gray-500 mb-1 flex justify-between items-center uppercase tracking-wider font-mono">Character Scale<div class="flex items-center gap-1"><input type="number" v-model.number="currentEntry.main_image_scale" min="10" max="400" class="w-12 bg-white text-gray-800 border border-gray-200 rounded px-1.5 py-0.5 text-xs text-right outline-none focus:border-[#d4b58e] font-mono shadow-sm"><span class="text-[#d4b58e]">%</span></div></label>
                                <input type="range" v-model.number="currentEntry.main_image_scale" min="10" max="400" class="w-full h-1.5 bg-gray-200 rounded-lg appearance-none cursor-pointer outline-none slider-thumb-style mb-2">
                                <input v-model="currentEntry.image_url" type="text" placeholder="主立绘 URL" class="w-full bg-white text-gray-800 border border-gray-200 rounded px-2 py-1.5 text-xs outline-none focus:border-[#d4b58e]">
                            </div>
                            <div class="bg-gray-50/50 p-2 rounded border border-gray-100">
                                <label class="text-[10px] font-bold text-gray-500 mb-1 flex justify-between items-center uppercase tracking-wider font-mono">Background Scale<div class="flex items-center gap-1"><input type="number" v-model.number="currentEntry.bg_image_scale" min="10" max="400" class="w-12 bg-white text-gray-800 border border-gray-200 rounded px-1.5 py-0.5 text-xs text-right outline-none focus:border-[#d4b58e] font-mono shadow-sm"><span class="text-[#d4b58e]">%</span></div></label>
                                <input type="range" v-model.number="currentEntry.bg_image_scale" min="10" max="400" class="w-full h-1.5 bg-gray-200 rounded-lg appearance-none cursor-pointer outline-none slider-thumb-style mb-2">
                                <input v-model="currentEntry.bg_image_url" type="text" placeholder="底图 URL" class="w-full bg-white text-gray-800 border border-gray-200 rounded px-2 py-1.5 text-xs outline-none focus:border-[#d4b58e]">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 右侧：文本信息编辑区 -->
                <div class="flex-1 h-[60%] md:h-full bg-white flex flex-col z-10 relative pointer-events-auto border border-gray-100 rounded-xl overflow-hidden shadow-sm">
                  <div class="flex-1 overflow-y-auto px-8 py-10 md:px-12 md:py-14 flex flex-col text-left relative z-0 custom-scrollbar" @scroll="onEditorScroll">
                    <div class="flex justify-between items-start gap-4">
                      <div class="flex-1 min-w-0 flex flex-col items-start justify-center">
                        <div class="flex flex-wrap items-center gap-3 mb-3">
                            <div class="flex items-center gap-2 bg-gray-50 border border-gray-100 px-3 py-1.5 rounded-lg w-fit transition-colors hover:border-gray-200">
                               <i data-lucide="layers" class="w-3.5 h-3.5 text-gray-400"></i>
                               <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest font-mono">Sort Order</span>
                               <input type="number" v-model.number="currentEntry.sort_order" class="w-14 bg-white border border-gray-200 rounded px-1.5 py-0.5 text-xs text-center outline-none focus:border-[#d4b58e] text-gray-700 font-mono shadow-sm">
                            </div>
                            <div class="flex items-center gap-2 bg-gray-50 border border-gray-100 px-3 py-1.5 rounded-lg transition-colors hover:border-gray-200">
                               <i data-lucide="image" class="w-3.5 h-3.5 text-gray-400"></i>
                               <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest hidden md:inline font-mono">Title Icon</span>
                               <input type="text" v-model="currentEntry.title_icon_url" placeholder="URL..." class="w-24 md:w-32 bg-white border border-gray-200 rounded px-1.5 py-0.5 text-xs outline-none focus:border-[#d4b58e] text-gray-700 font-mono shadow-sm">
                               <div class="w-px h-3 bg-gray-300 mx-1"></div>
                               <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest font-mono">Scale</span>
                               <input type="range" v-model.number="currentEntry.title_icon_scale" min="20" max="300" class="w-16 md:w-20 h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer slider-thumb-style">
                               <div class="flex items-center gap-0.5">
                                   <input type="number" v-model.number="currentEntry.title_icon_scale" min="20" max="300" class="w-12 bg-white border border-gray-200 rounded px-1.5 py-0.5 text-xs text-right outline-none focus:border-[#d4b58e] text-gray-700 font-mono shadow-sm">
                                   <span class="text-[10px] font-mono text-gray-500">%</span>
                               </div>
                            </div>
                        </div>
                        <div class="w-full flex flex-col gap-2">
                            <div v-for="(line, idx) in currentEntry.titleLines" :key="'std-title-'+idx" class="flex items-center gap-2 group w-full">
                                <editable-div v-model="currentEntry.titleLines[idx]" placeholder="大标题" class="text-3xl md:text-4xl font-bold tracking-tight text-gray-900 uppercase focus:bg-gray-50 font-cinzel w-full text-left" style="line-height: 1.2;"></editable-div>
                                <div class="flex flex-col opacity-0 group-hover:opacity-100 transition-opacity shrink-0 gap-1">

                                        <!-- 添加按钮 -->
                                        <div class="mt-4 pt-4 border-t border-white/10 flex gap-3 opacity-50 hover:opacity-100 transition-opacity">
                                            <button @click="addBlock('paragraph')" class="text-xs flex items-center gap-1.5 text-white/70 hover:text-white bg-white/10 px-4 py-1.5 rounded-full hover:bg-white/20 transition-all font-mono"><i data-lucide="align-left" class="w-3.5 h-3.5"></i> 段落</button>
                                            <button @click="addBlock('quote')" class="text-xs flex items-center gap-1.5 text-white/70 hover:text-white bg-white/10 px-4 py-1.5 rounded-full hover:bg-white/20 transition-all font-mono"><i data-lucide="message-square" class="w-3.5 h-3.5"></i> 引言</button>
                                            <button @click="addBlock('key-value')" class="text-xs flex items-center gap-1.5 text-white/70 hover:text-white bg-white/10 px-4 py-1.5 rounded-full hover:bg-white/20 transition-all font-mono" title="添加至左侧属性栏"><i data-lucide="list" class="w-3.5 h-3.5"></i> 档案(KV)</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- Gallery 图片轮播管理弹窗 -->
                <div v-if="showGalleryModal" class="absolute inset-0 z-[100] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 md:p-8 pointer-events-auto" @click.self="closeGalleryModal">
                    <div class="bg-[#111] border border-white/10 rounded-2xl shadow-2xl w-full max-w-xl max-h-[80vh] flex flex-col overflow-hidden">
                        <div class="flex items-center justify-between px-5 py-3 border-b border-white/10 shrink-0">
                            <h3 class="text-sm font-bold text-white font-serif-sc flex items-center gap-2">
                                <i data-lucide="images" class="w-4 h-4 text-[#d4b58e]"></i> 轮播图片管理
                            </h3>
                            <button @click="closeGalleryModal" class="w-7 h-7 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-white/40 hover:text-white transition-all">
                                <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                            </button>
                        </div>
                        <div class="flex-1 overflow-y-auto p-4 space-y-2 custom-scrollbar">
                            <div v-if="galleryEditList.length === 0" class="text-center py-8 text-gray-500 font-mono text-xs">暂无图片，点击下方按钮添加</div>
                            <div v-for="(url, idx) in galleryEditList" :key="'gallery-img-'+idx"
                                class="group flex items-center gap-3 p-2 rounded-lg border border-white/5 hover:border-[#d4b58e]/30 hover:bg-white/[0.02] transition-all">
                                <div class="w-16 h-10 shrink-0 rounded overflow-hidden bg-black border border-white/5">
                                    <img :src="url" class="w-full h-full object-cover" @error="$event.target.style.display='none'" />
                                </div>
                                <input type="text" :value="url" @input="galleryEditList[idx] = $event.target.value" class="flex-1 bg-black/50 border border-white/10 rounded px-2 py-1 text-xs font-mono text-gray-300 focus:outline-none focus:border-[#d4b58e] min-w-0" />
                                <div class="flex items-center gap-1 shrink-0">
                                    <button @click="moveGalleryImage(idx, -1)" :disabled="idx === 0" class="p-1 text-white/30 hover:text-white disabled:opacity-20 transition-colors"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6"/></svg></button>
                                    <button @click="moveGalleryImage(idx, 1)" :disabled="idx === galleryEditList.length - 1" class="p-1 text-white/30 hover:text-white disabled:opacity-20 transition-colors"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
                                    <button @click="galleryEditList.splice(idx, 1)" class="p-1 text-red-400/50 hover:text-red-400 transition-colors"><svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center justify-between px-5 py-3 border-t border-white/10 shrink-0">
                            <button @click="galleryEditList.push('')" class="text-xs flex items-center gap-1.5 text-white/70 hover:text-[#d4b58e] transition-colors font-mono">
                                <i data-lucide="plus" class="w-3.5 h-3.5"></i> 添加图片 URL
                            </button>
                            <div class="flex gap-2">
                                <button @click="closeGalleryModal" class="px-3 py-1.5 text-xs text-gray-400 hover:text-white transition-colors font-mono">取消</button>
                                <button @click="saveGalleryImages" class="px-4 py-1.5 text-xs bg-[#d4b58e] text-white rounded-lg hover:bg-[#c2a27b] transition-colors font-bold font-mono shadow-sm">确认</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- 弹窗：删除确认 (锁定为亮色) -->
    <div v-if="showDeleteModal" class="fixed inset-0 z-[500] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 pointer-events-auto">
        <div class="border p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center relative overflow-hidden bg-white border-gray-100">
            <div class="absolute top-0 left-0 w-full h-1.5 bg-red-500"></div>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-red-500 mx-auto mb-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
            <h3 class="text-xl font-bold mb-2 tracking-wider font-serif-sc text-gray-800">是否删除当前词条？</h3>
            <p class="text-xs mb-6 font-mono text-gray-500">请注意：删除操作不可逆。</p>
            <div class="flex gap-3 justify-center">
                <button @click="showDeleteModal = false" class="px-5 py-2.5 border rounded-lg text-sm transition-colors font-bold bg-white border-gray-300 text-gray-600 hover:bg-gray-50 hover:border-gray-400">取消</button>
                <button @click="executeDelete" class="px-5 py-2.5 bg-red-500/10 text-red-500 border border-red-500/20 rounded-lg text-sm hover:bg-red-500/20 transition-colors font-bold">确认抹除</button>
            </div>
        </div>
    </div>

    <!-- 提示框始终一致 -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl transition-all duration-300 opacity-0 translate-y-4 pointer-events-none z-[600] flex items-center gap-2">
        <span id="toast-msg" class="text-sm tracking-wide font-medium"></span>
    </div>

    <!-- 悬浮文字格式化工具栏 (锁定为亮色) -->
    <div id="floating-toolbar" class="fixed z-[500] border rounded-lg shadow-xl flex items-center px-1.5 py-1.5 gap-1 inactive transition-colors bg-white border-gray-200 text-gray-600">
        <button onclick="applyFormat('bold')" class="p-1.5 rounded transition-colors hover:bg-gray-100" title="加粗"><i data-lucide="bold" class="w-3.5 h-3.5"></i></button>
        <button onclick="applyFormat('italic')" class="p-1.5 rounded transition-colors hover:bg-gray-100" title="斜体"><i data-lucide="italic" class="w-3.5 h-3.5"></i></button>
        <div class="w-px h-4 mx-0.5 bg-gray-200"></div>
        <div class="flex items-center gap-1.5 px-1">
            <button onclick="applyFormat('foreColor', '#d4b58e')" class="w-4 h-4 rounded-full bg-[#d4b58e] hover:ring-2 hover:ring-offset-1 ring-[#d4b58e]/50 transition-all hover:ring-offset-white"></button>
            <button onclick="applyFormat('foreColor', '#ef4444')" class="w-4 h-4 rounded-full bg-red-500 hover:ring-2 hover:ring-offset-1 ring-red-500/50 transition-all hover:ring-offset-white"></button>
            <button onclick="applyFormat('foreColor', '#3b82f6')" class="w-4 h-4 rounded-full bg-blue-500 hover:ring-2 hover:ring-offset-1 ring-blue-500/50 transition-all hover:ring-offset-white"></button>
        </div>
        <div class="w-px h-4 mx-0.5 bg-gray-200"></div>
        <button onclick="applyFormat('removeFormat')" class="p-1.5 rounded transition-colors hover:bg-red-50 text-gray-400 hover:text-red-500" title="清除样式"><i data-lucide="eraser" class="w-3.5 h-3.5"></i></button>
    </div>
  </div>

  <script>
    const { createApp, ref, computed, onMounted, watch, nextTick } = Vue; 

    const EditableDiv = {
        props: ['modelValue', 'placeholder'],
        emits: ['update:modelValue'],
        template: `<div contenteditable="true" :placeholder="placeholder" @blur="onInput" @input="onInput" class="outline-none empty:before:content-[attr(placeholder)] empty:before:opacity-40 cursor-text min-h-[1.5em] transition-colors -mx-2 px-2 py-1"></div>`,
        mounted() { this.$el.innerHTML = this.modelValue || ''; },
        watch: {
            modelValue(newVal) { if (this.$el.innerHTML !== newVal) this.$el.innerHTML = newVal || ''; }
        },
        methods: {
            onInput(e) { this.$emit('update:modelValue', e.target.innerHTML); }
        }
    };

    let supabaseClient = null;
    try {
        const supabaseUrl = 'https://qunhjfulchaurfxtjoeg.supabase.co';
        const supabaseKey = 'sb_publishable_Nkbcb5N92HUqJAGB9TYnJQ_W_09BC-T';
        supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
    } catch(e) { console.error('Supabase Failed', e); }

    function generateId() { return Math.random().toString(36).substr(2, 9); }
    function showToast(msg, isError = false) {
        const t = document.getElementById('toast'); document.getElementById('toast-msg').innerText = msg;
        t.className = `fixed bottom-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl transition-all duration-300 z-[600] flex items-center gap-2 pointer-events-none ${isError ? 'bg-red-500 text-white' : 'bg-gray-900 text-white'}`;
        t.classList.remove('opacity-0', 'translate-y-4');
        setTimeout(() => t.classList.add('opacity-0', 'translate-y-4'), 3000);
    }

    let activeTextarea = null;
    function updateToolbarPosition() {
        const selection = window.getSelection(); const toolbar = document.getElementById('floating-toolbar');
        if (!selection.rangeCount || selection.isCollapsed) { toolbar.classList.remove('active'); toolbar.classList.add('inactive'); activeTextarea = null; return; }
        let node = selection.anchorNode; if (node.nodeType === 3) node = node.parentNode;
        const editable = node.closest('[contenteditable="true"]');
        if (editable) {
            activeTextarea = editable; const range = selection.getRangeAt(0); const rect = range.getBoundingClientRect();
            toolbar.style.left = (rect.left + rect.width / 2) + 'px';
            toolbar.style.top = (rect.top - 50) + 'px';
            toolbar.classList.remove('inactive'); toolbar.classList.add('active');
        } else { toolbar.classList.remove('active'); toolbar.classList.add('inactive'); activeTextarea = null; }
    }
    document.addEventListener('selectionchange', () => { setTimeout(updateToolbarPosition, 10); });
    function applyFormat(command, value = null) {
        if (!activeTextarea) return; document.execCommand(command, false, value);
        activeTextarea.dispatchEvent(new Event('input', { bubbles: true }));
    }

    const app = createApp({
        components: { EditableDiv },
        setup() {
            const nodesDict = [
                { id: 'aeons', title: '神祇' },
                { id: 'characters', title: '角色' },
                { id: 'enemies', title: '敌对物种' },
                { id: 'relics', title: '圣物' },
                { id: 'gallery', title: '留影' },
                { id: 'factions', title: '势力' },
                { id: 'terms', title: '专有名词' }
            ];

            const allRecords = ref([]);
            const searchQuery = ref('');
            const isSearchDropdownOpen = ref(false);
            const isSaving = ref(false);
            const showDeleteModal = ref(false);
            const showGalleryModal = ref(false);
            const galleryEditList = ref([]);
            const draggedIndex = ref(null);
            const dragOverIndex = ref(null);

            const currentEntry = ref({
                id: '', node_id: 'aeons', titleLines: [''], subtitle: '', 
                bg_image_url: '', bg_image_scale: 120, 
                image_url: '', main_image_scale: 100, 
                title_icon_url: '', title_icon_scale: 100,
                alien_text: '',
                gallery_images: '',
                sort_order: 0, blocks: []
            });
            
            const isDarkStyle = computed(() => ['aeons', 'gallery'].includes(currentEntry.value.node_id));

            const filteredRecords = computed(() => {
                if (!searchQuery.value.trim()) return allRecords.value;
                const query = searchQuery.value.trim().toLowerCase();
                return allRecords.value.filter(r => (r.title && r.title.toLowerCase().includes(query)));
            });

            const closeSearchDropdown = () => { isSearchDropdownOpen.value = false; };

            const selectRecord = (id) => {
                loadEvent(id);
                isSearchDropdownOpen.value = false;
                searchQuery.value = ''; 
            };

            const onEditorScroll = () => {
                if (activeTextarea) updateToolbarPosition();
            };

            onMounted(() => {
                loadEventList();
                if(window.lucide) window.lucide.createIcons();
            });

            const loadEventList = async () => {
                if(!supabaseClient) return;
                try {
                    const { data, error } = await supabaseClient.from('entries').select('id, title, node_id').order('created_at', { ascending: false });
                    if (!error) allRecords.value = data || [];
                } catch(e) {}
            };

            const deserializeContent = (row) => {
                let blocks = [];
                if (row.blocks) {
                    try {
                        let firstParagraphFound = false;
                        JSON.parse(row.blocks).forEach(b => {
                            if(b.type === 'paragraph' || b.type === 'image' || b.type === 'key-value' || b.type === 'quote') {
                                if (b.type === 'paragraph' && b.dropCap === undefined) {
                                    b.dropCap = !firstParagraphFound;
                                    firstParagraphFound = true;
                                }
                                blocks.push(b);
                            }
                        });
                    } catch(e) {}
                } else if (row.content) {
                    blocks = [{ id: generateId(), type: 'paragraph', content: row.content, dropCap: true }];
                } else {
                    blocks = [{ id: generateId(), type: 'paragraph', content: '', dropCap: true }];
                }
                return { blocks };
            };

            const loadEvent = async (id) => {
                if(!id || !supabaseClient) return;
                try {
                    const { data, error } = await supabaseClient.from('entries').select('*').eq('id', id).single();
                    if (error) throw error;
                    
                    const parsed = deserializeContent(data);
                    const isGallery = data.node_id === 'gallery';
                    currentEntry.value = {
                        id: data.id, node_id: data.node_id || 'aeons',
                        titleLines: data.title ? data.title.split('\n') : [''], 
                        subtitle: data.subtitle || '',
                        bg_image_url: isGallery ? (data.bg_image_url || '') : (data.bg_image_url || ''),
                        bg_image_scale: data.bg_image_scale || 120,
                        image_url: data.image_url || '',
                        main_image_scale: data.main_image_scale || 100,
                        title_icon_url: data.title_icon_url || '',
                        title_icon_scale: data.title_icon_scale || 100,
                        alien_text: data.alien_text || '',
                        gallery_images: isGallery ? (data.gallery_images || '') : '',
                        sort_order: data.sort_order || 0,
                        blocks: parsed.blocks
                    };
                } catch(e) { showToast('读取失败', true); }
            };

            const createNew = async () => {
                const targetNode = currentEntry.value.node_id || 'aeons';
                let nextSort = 0;
                if (supabaseClient) {
                    try {
                        const { data } = await supabaseClient.from('entries').select('sort_order').eq('node_id', targetNode).order('sort_order', { ascending: false }).limit(1);
                        if (data && data.length > 0) nextSort = (data[0].sort_order || 0) + 1;
                    } catch(e) {}
                }
                currentEntry.value = { id: '', node_id: targetNode, titleLines: [''], subtitle: '', bg_image_url: '', bg_image_scale: 120, image_url: '', main_image_scale: 100, title_icon_url: '', title_icon_scale: 100, alien_text: '', gallery_images: '', sort_order: nextSort, blocks: [{ id: generateId(), type: 'paragraph', content: '', dropCap: true }] };
                searchQuery.value = ''; 
            };

            const addBlock = (type) => {
                currentEntry.value.blocks.push({ id: generateId(), type, content: '', url: '', caption: '', key: '', value: '', scale: 100, author: '', dropCap: false });
                setTimeout(() => { 
                    const el = isDarkStyle.value ? document.querySelector('.extreme-dark-scrollbar') : document.querySelector('.custom-scrollbar'); 
                    if(el) el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' }); 
                }, 100);
            };

            const enableDrag = (e) => {
                const block = e.currentTarget.closest('.draggable-block');
                if (block) block.setAttribute('draggable', 'true');
            };
            const disableDrag = (e) => {
                const block = e.currentTarget.closest('.draggable-block');
                if (block) block.setAttribute('draggable', 'false');
            };
            const dragStart = (e, index) => {
                draggedIndex.value = index;
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', index);
                setTimeout(() => { e.target.style.opacity = '0.5'; }, 0);
            };
            const dragOver = (e, index) => { dragOverIndex.value = index; };
            const dragLeave = (e) => {};
            const drop = (e, index) => {
                if (draggedIndex.value !== null && draggedIndex.value !== index) {
                    const blocks = currentEntry.value.blocks;
                    const movedItem = blocks.splice(draggedIndex.value, 1)[0];
                    blocks.splice(index, 0, movedItem);
                }
                dragOverIndex.value = null;
                draggedIndex.value = null;
                const block = e.currentTarget.closest('.draggable-block');
                if (block) { block.setAttribute('draggable', 'false'); block.style.opacity = '1'; }
            };
            const dragEnd = (e) => {
                dragOverIndex.value = null; draggedIndex.value = null;
                e.target.style.opacity = '1'; e.target.setAttribute('draggable', 'false');
            };

            const save = async () => {
                if(!supabaseClient) return showToast('脱机模式，无法保存', true);
                if(!currentEntry.value.titleLines[0]) return showToast('必须填写大标题', true);
                
                isSaving.value = true;

                let contentText = '';
                currentEntry.value.blocks.forEach(b => {
                    if (b.type === 'paragraph') contentText += `${b.content}\n\n`;
                    else if (b.type === 'image') contentText += `![${b.caption || ''}](${b.url || ''})\n\n`;
                    else if (b.type === 'key-value') contentText += `**${b.key}**: ${b.value}\n\n`;
                    else if (b.type === 'quote') contentText += `> ${b.content}\n> —— ${b.author}\n\n`;
                });

                const payload = {
                    node_id: currentEntry.value.node_id, 
                    title: currentEntry.value.titleLines.join('\n').trim(),
                    subtitle: currentEntry.value.subtitle.trim(),
                    image_url: currentEntry.value.image_url,
                    main_image_scale: currentEntry.value.main_image_scale,
                    bg_image_url: currentEntry.value.node_id === 'gallery' ? currentEntry.value.bg_image_url : currentEntry.value.bg_image_url,
                    bg_image_scale: currentEntry.value.bg_image_scale,
                    title_icon_url: currentEntry.value.title_icon_url || '',
                    title_icon_scale: currentEntry.value.title_icon_scale || 100,
                    alien_text: currentEntry.value.alien_text || '',
                    gallery_images: currentEntry.value.node_id === 'gallery' ? (currentEntry.value.gallery_images || '') : '',
                    sort_order: currentEntry.value.sort_order,
                    blocks: JSON.stringify(currentEntry.value.blocks),
                    content: contentText.trim()
                };

                try {
                    let res = currentEntry.value.id ? await supabaseClient.from('entries').update(payload).eq('id', currentEntry.value.id) : await supabaseClient.from('entries').insert([payload]).select();
                    if (res.error) throw res.error; 
                    showToast('档案同频烧录成功！'); 
                    await loadEventList();
                    if (!currentEntry.value.id && res.data && res.data.length > 0) {
                        currentEntry.value.id = res.data[0].id;
                    }
                } catch(e) { showToast('烧录失败: ' + (e.message || '权限不足'), true); }
                finally { isSaving.value = false; }
            };

            const promptDelete = () => { showDeleteModal.value = true; };
            const executeDelete = async () => {
                try {
                    const { error } = await supabaseClient.from('entries').delete().eq('id', currentEntry.value.id);
                    if (error) throw error; 
                    
                    showToast('档案已被彻底抹除');
                    showDeleteModal.value = false;
                    await loadEventList(); createNew();
                } catch(e) { showToast('删除失败: ' + (e.message || '权限不足'), true); }
            };

            const openGalleryModal = () => {
                let images = []
                try {
                    const parsed = JSON.parse(currentEntry.value.bg_image_url || '[]');
                    if (Array.isArray(parsed)) images = parsed;
                } catch {}
                if (images.length === 0 && currentEntry.value.bg_image_url && !currentEntry.value.bg_image_url.startsWith('[')) {
                    images = [currentEntry.value.bg_image_url]
                }
                galleryEditList.value = images;
                showGalleryModal.value = true;
                nextTick(() => { if (window.lucide) lucide.createIcons(); });
            };

            const closeGalleryModal = () => {
                showGalleryModal.value = false;
            };

            const saveGalleryImages = () => {
                const validUrls = galleryEditList.value.filter(u => u.trim() !== '');
                const json = JSON.stringify(validUrls);
                currentEntry.value.bg_image_url = json;
                currentEntry.value.gallery_images = json;
                showGalleryModal.value = false;
                showToast('轮播图配置已更新');
            };

            const moveGalleryImage = (idx, dir) => {
                const target = idx + dir;
                if (target < 0 || target >= galleryEditList.value.length) return;
                const arr = galleryEditList.value;
                [arr[idx], arr[target]] = [arr[target], arr[idx]];
            };

            document.addEventListener('paste', function(e) {
                const target = e.target;
                if (target.getAttribute('contenteditable') === 'true') {
                    e.preventDefault(); const text = (e.originalEvent || e).clipboardData.getData('text/plain');
                    document.execCommand('insertText', false, text);
                }
            });

            createNew();

            const galleryImagesList = computed(() => {
                try {
                    const parsed = JSON.parse(currentEntry.value.bg_image_url || '[]');
                    if (Array.isArray(parsed)) return parsed;
                } catch {}
                if (currentEntry.value.bg_image_url && !currentEntry.value.bg_image_url.startsWith('[')) {
                    return [currentEntry.value.bg_image_url];
                }
                return [];
            });

            const galleryPreviewUrl = computed(() => {
                const list = galleryImagesList.value;
                return list.length > 0 ? list[0] : (currentEntry.value.image_url || '');
            });

            return {
                nodesDict, allRecords, currentEntry, isDarkStyle,
                searchQuery, isSearchDropdownOpen, filteredRecords, closeSearchDropdown, selectRecord,
                loadEvent, createNew, addBlock, save, isSaving,
                showDeleteModal, promptDelete, executeDelete, onEditorScroll,
                showGalleryModal, galleryEditList, openGalleryModal, closeGalleryModal, saveGalleryImages, moveGalleryImage, galleryImagesList, galleryPreviewUrl,
                draggedIndex, dragOverIndex, enableDrag, disableDrag, dragStart, dragOver, dragLeave, drop, dragEnd
            };
        }
    });

    app.mount('#app');
  </script>
</body>
</html>
