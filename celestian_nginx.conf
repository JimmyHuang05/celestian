# 直接 HTTP 访问 → 重定向到 HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# 原有内容服务（只接受 CDN 回源 / 内网访问）
server {
    listen 80;
    listen [::]:80;

    server_name celestian.jimmyhuang.cn;

    root /var/www/celestian;
    index index.html index.htm;

    access_log /var/log/nginx/celestian.access.log;
    error_log /var/log/nginx/celestian.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /data/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /editor/ {
        index index.html;
        try_files $uri $uri/ =404;
    }

    location = /baidu_verify_codeva-9nWPZdui8T.html {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
