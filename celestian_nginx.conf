server {
    listen 80;
    listen [::]:80;
    server_name celestian.jimmyhuang.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name celestian.jimmyhuang.cn;

    ssl_certificate /etc/ssl/certs/celestian.jimmyhuang.cn.pem;
    ssl_certificate_key /etc/ssl/private/celestian.jimmyhuang.cn.key;

    root /var/www/celestian;
    index index.html index.htm;

    access_log /var/log/nginx/celestian.access.log;
    error_log /var/log/nginx/celestian.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /data/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /editor/ {
        index index.html;
        try_files $uri $uri/ =404;
    }

    location = /baidu_verify_codeva-9nWPZdui8T.html {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
