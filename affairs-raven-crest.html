<!doctype html>

  <style>
    *{box-sizing:border-box}body{--bg:#e9e6de;--ink:#252622;--muted:#696b62;--line:#292b2529;margin:0;background:var(--bg);color:var(--ink);font-family:'Songti SC',SimSun,serif;transition:background .2s,color .2s}body.dark{--bg:#141619;--ink:#e9e6de;--muted:#a6a69e;--line:#e9e6de26}a,button{color:inherit}a{text-decoration:none}button{cursor:pointer;font:inherit}a:focus-visible,button:focus-visible{outline:1px solid currentColor;outline-offset:5px}.page{max-width:1580px;margin:auto;padding:30px 4vw 24px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line);padding-bottom:22px}.brand{font:10px/1.6 Georgia,serif;letter-spacing:.17em;color:var(--muted)}nav{display:flex;align-items:center;gap:24px;font:11px system-ui,sans-serif}.theme{background:none;border:1px solid var(--line);padding:9px 14px;font:inherit}.layout{display:grid;grid-template-columns:minmax(220px,.65fr) minmax(0,1.35fr);align-items:center;gap:6vw;min-height:calc(100svh - 140px);padding:24px 0}.label{font:10px Georgia,serif;letter-spacing:.22em;color:var(--muted);margin:0 0 22px}h1{font-size:clamp(28px,3.2vw,47px);font-weight:400;letter-spacing:.12em;line-height:1.5;margin:0 0 24px}.lead{font-size:16px;letter-spacing:.13em;line-height:1.9;margin:0 0 30px}.details{max-width:310px;color:var(--muted);font:12px/2 system-ui,sans-serif;margin:0 0 30px}.download{display:inline-block;border-bottom:1px solid var(--ink);padding-bottom:8px;font:12px system-ui,sans-serif}.art{border:0;padding:6px;background:none;display:block;width:100%;cursor:zoom-in}.art img{display:block;width:100%;height:clamp(440px,76svh,840px);object-fit:contain}.hint{color:var(--muted);font:10px system-ui,sans-serif;margin-top:15px}footer{border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;gap:18px;color:var(--muted);font:10px/1.7 system-ui,sans-serif}dialog{color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:16px;width:min(980px,95vw);max-height:96svh}dialog::backdrop{background:#000a;backdrop-filter:blur(5px)}.modal-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;letter-spacing:.12em}.close{border:0;background:none;font-size:25px}.full{width:100%;height:82svh;object-fit:contain;display:block;padding:10px}@media(max-width:720px){.page{padding:22px 6vw}.brand{max-width:185px;font-size:8px}nav{gap:14px}.layout{grid-template-columns:1fr;gap:15px;padding-top:32px}.text{display:contents}.label{margin:0}h1{margin:0}.lead{margin:0}.art{grid-row:4}.art img{height:auto;max-height:65svh}.details{margin:0;max-width:none}.download{justify-self:start}footer{margin-top:24px;flex-direction:column;gap:5px}.full{height:75svh}}@media(prefers-reduced-motion:reduce){body{transition:none}}
  </style>
</head>
<body><div class="page">
<header><div class="brand">ORLANIA / BUREAU OF UNCONVENTIONAL AFFAIRS</div><nav><button class="theme" aria-pressed="false" type="button">切换深色底</button><a href="/unconventional-affairs.html">返回详情页 ↗</a></nav></header>
<main class="layout">
  <section class="text"><p class="label">HERALDIC STUDY / CRIMSON &amp; NAVY</p><h1>非常规事务署</h1><p class="lead">双鸦 · 典钥 · 鸢尾</p><p class="details">双鸦向外守望，交叉钥匙与鸢尾居于盾中。冠饰、盔甲和卷叶以细密刻线相连，保留古老纹章的秩序与神秘。<br><br>左绯红 · 右海军蓝<br>银色浮雕，象牙白飘带。</p><a class="download" href="/unconventional-affairs/crests-v6/raven-red-navy.png" download="unconventional-affairs-raven-red-navy.png">下载透明原图 ↓</a><p class="hint">点击纹章可放大查看</p></section>
  <button class="art" type="button" aria-label="放大双鸦纹章"><img src="/unconventional-affairs/crests-v6/raven-red-navy.png" alt="双鸦护卫交叉钥匙与鸢尾盾牌，上方为冠饰与双盔，下方为留白飘带" width="1169" height="1345" decoding="async"></button>
</main>
<footer><span>非常规事务署 / 纹章细化稿</span><span>透明底 PNG · 可切换深浅背景</span></footer>
</div>
<dialog aria-label="双鸦纹章大图"><div class="modal-head"><span>双鸦纹章 · 细节</span><button class="close" type="button" aria-label="关闭大图">×</button></div><img class="full" src="/unconventional-affairs/crests-v6/raven-red-navy.png" alt="双鸦纹章完整大图"></dialog>
<script type="module">
  const modal=document.querySelector('dialog');
  document.querySelector('.theme').addEventListener('click',function(){const dark=document.body.classList.toggle('dark');this.setAttribute('aria-pressed',String(dark));this.textContent=dark?'切换浅色底':'切换深色底';document.querySelector('meta[name="theme-color"]').content=dark?'#141619':'#e9e6de'});
  document.querySelector('.art').addEventListener('click',()=>modal.showModal());
  document.querySelector('.close').addEventListener('click',()=>modal.close());
  modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}});
</script>
