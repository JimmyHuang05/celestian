<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e7e3da">
  <title>逐猎之狮 · 双首王冠与战旗</title>
  <link rel="stylesheet" href="/src/fonts/faction-song.css">
  <style>
    *{box-sizing:border-box}
    body{--paper:#e7e3da;--ink:#302f2b;--muted:#777166;--line:#37312828;margin:0;background:var(--paper);color:var(--ink);font-family:'Celestian Faction Song','Songti SC',SimSun,serif;transition:background-color .4s,color .4s}
    body.dark{--paper:#1b1d1e;--ink:#e4dfd3;--muted:#a19b8e;--line:#dfd4ba26}
    a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
    button:focus-visible,a:focus-visible{outline:2px solid var(--muted);outline-offset:6px}
    .page{max-width:1520px;margin:auto;padding:26px clamp(22px,4.5vw,76px) 20px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:19px}
    .eyebrow{font:10px/1.7 Georgia,serif;letter-spacing:.2em;color:var(--muted);margin:0 0 7px}
    h1{font-size:19px;font-weight:400;letter-spacing:.2em;margin:0}
    nav{display:flex;align-items:center;gap:22px;font-size:12px}
    .theme{border:1px solid var(--line);background:transparent;padding:9px 14px}
    .board{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:clamp(44px,7vw,115px);padding:24px 0 26px}
    .board::before{content:'';position:absolute;left:50%;top:12%;bottom:12%;width:1px;background:linear-gradient(transparent,var(--line) 25%,var(--line) 75%,transparent);pointer-events:none}
    figure{margin:0;min-width:0;text-align:center}
    .art{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
    .art img{display:block;width:100%;height:clamp(340px,65svh,730px);object-fit:contain}
    figcaption{padding-top:19px}
    h2{font-size:clamp(22px,2vw,30px);font-weight:400;letter-spacing:.2em;margin:0 0 12px;padding-left:.2em}
    .meaning{font-size:12px;letter-spacing:.24em;color:var(--muted);margin:0}
    footer{border-top:1px solid var(--line);padding-top:15px;display:flex;justify-content:space-between;gap:16px;font-size:11px;color:var(--muted);line-height:1.8;letter-spacing:.08em}
    dialog{width:min(980px,94vw);max-height:94svh;padding:18px 22px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
    dialog::backdrop{background:#111b;backdrop-filter:blur(4px)}
    .dialog-head{display:flex;align-items:center;justify-content:space-between;gap:20px}
    .dialog-head h2{font-size:20px;margin:0}.dialog-head button{border:0;background:none;font-size:26px}
    .full{display:block;width:100%;height:76svh;object-fit:contain;margin:10px auto}
    .download{font-size:12px;border-bottom:1px solid var(--muted);padding-bottom:4px}
    @media(max-width:660px){.board{grid-template-columns:1fr}.board::before{display:none}.board .art img{height:65svh}.board figure{margin-bottom:24px}.page{padding-top:20px}header{align-items:flex-start}.eyebrow{font-size:8px}h1{font-size:16px}nav{gap:12px;font-size:10px}nav a{display:none}.board{gap:20px;padding:32px 0}.art img{height:clamp(230px,42svh,410px)}h2{font-size:21px;letter-spacing:.08em}.meaning{font-size:10px;letter-spacing:.12em}footer{flex-direction:column;gap:4px}.full{height:69svh}}
    @media(prefers-reduced-motion:reduce){body{transition:none}}
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div><p class="eyebrow">CELESTIAN / ORDER HERALDRY</p><h1>逐猎之狮 · 纹章与战旗</h1></div>
      <nav><button class="theme" type="button" aria-pressed="false">切换深色底</button><a href="/lion-orders-v3.html">查看上一轮 ↗</a></nav>
    </header>
    <main class="board" aria-label="双头狮皇冠纹章与竖向战旗对比"><figure><button class="art" type="button" data-crest="crowned-double-lion-shield-v4" data-name="Ⅰ · 双首王冠纹章" aria-label="查看Ⅰ · 双首王冠纹章原图"><img src="/lion-orders/crests-v4/crowned-double-lion-shield-v4.webp" alt="Ⅰ · 双首王冠纹章：银白盾 · 黑十字 · 冠冕双首金狮" width="1000" height="1250" fetchpriority="high"></button><figcaption><h2>Ⅰ · 双首王冠纹章</h2><p class="meaning">银白盾 · 黑十字 · 冠冕双首金狮</p></figcaption></figure><figure><button class="art" type="button" data-crest="crowned-double-lion-banner-v4" data-name="Ⅱ · 逐猎战旗" aria-label="查看Ⅱ · 逐猎战旗原图"><img src="/lion-orders/crests-v4/crowned-double-lion-banner-v4.webp" alt="Ⅱ · 逐猎战旗：竖向垂旗 · 金线刺绣 · 双尾旗摆" width="625" height="1500" fetchpriority="high"></button><figcaption><h2>Ⅱ · 逐猎战旗</h2><p class="meaning">竖向垂旗 · 金线刺绣 · 双尾旗摆</p></figcaption></figure></main>
    <footer><span>第三势力 / 逐猎之狮 · 双首王冠 · 两种载体</span><span>黑铁 · 象牙白 · 旧金　／　点击纹章查看原图</span></footer>
  </div>
  <dialog aria-labelledby="crest-title">
    <div class="dialog-head"><h2 id="crest-title"></h2><button class="close" type="button" aria-label="关闭大图">×</button></div>
    <img class="full" alt="">
    <a class="download" download>下载透明 PNG 原图 ↓</a>
  </dialog>
  <script type="module">
    const modal=document.querySelector('dialog');
    document.querySelector('.theme').addEventListener('click',function(){
      const dark=document.body.classList.toggle('dark');
      this.setAttribute('aria-pressed',String(dark));
      this.textContent=dark?'切换浅色底':'切换深色底';
      document.querySelector('meta[name="theme-color"]').content=dark?'#1b1d1e':'#e7e3da';
    });
    for(const button of document.querySelectorAll('.art'))button.addEventListener('click',()=>{
      const url=`/lion-orders/crests-v4/${button.dataset.crest}.png`;
      modal.querySelector('h2').textContent=button.dataset.name;
      modal.querySelector('img').src=url;
      modal.querySelector('img').alt=`${button.dataset.name}纹章完整原图`;
      modal.querySelector('a').href=url;
      modal.querySelector('a').download=`${button.dataset.crest}.png`;
      modal.showModal();
    });
    modal.querySelector('.close').addEventListener('click',()=>modal.close());
    modal.addEventListener('click',event=>{
      if(event.target!==modal)return;
      const rect=modal.getBoundingClientRect();
      if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)modal.close();
    });
  </script>
</body>
</html>
