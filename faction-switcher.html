<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#28394e">
  <title>势力切换 · Celestian</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23c5cbd2' d='m16 2 4 10 10 4-10 4-4 10-4-10-10-4 10-4Z'/%3E%3C/svg%3E">
  <style>
    @font-face{font-family:Celestian;src:url('/src/fonts/identity/noto-serif-sc-400.ttf') format('truetype');font-display:swap}
    *{box-sizing:border-box}body{margin:0;background:#192736;color:#e5e8e7;font-family:Celestian,serif}button{font:inherit}.preview{--base:#344761;--shade:#203044;--glow:#6a809b;min-height:100svh;padding:32px 5% 150px;background:radial-gradient(ellipse at 72% 20%,color-mix(in srgb,var(--glow) 35%,transparent),transparent 65%),linear-gradient(120deg,var(--base),var(--shade));position:relative;isolation:isolate;overflow:hidden;transition:background .35s}.preview-header{display:flex;justify-content:space-between;align-items:center;color:#c5ced499;font:11px system-ui,sans-serif;letter-spacing:.1em}.preview-header span:last-child{font:11px Georgia,serif;letter-spacing:.3em}.preview-content{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:calc(100svh - 215px)}.preview-country{font-size:13px;letter-spacing:.16em;color:#c5d0dc;margin:0 0 22px}.preview-name{font-size:clamp(31px,4.8vw,65px);font-weight:400;letter-spacing:.18em;margin:0;line-height:1.6}.preview-note{font-size:11px;line-height:2;letter-spacing:.12em;color:#b5c1ce88;margin:22px 0 0}.preview-orbit{position:absolute;width:850px;height:850px;border:1px solid #ffffff07;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-51%);z-index:-1;pointer-events:none}.preview-orbit:before{content:'';position:absolute;inset:30px;border:1px solid #ffffff04;border-radius:50%}.preview[data-country=independent]{background:radial-gradient(ellipse at 65% 25%,#44568044,transparent 60%),linear-gradient(120deg,#101b2c,#080f1a)}.preview-stars{display:none;position:absolute;inset:0;pointer-events:none;z-index:-1}.preview[data-country=independent] .preview-stars{display:block}.preview-hint{position:absolute;bottom:115px;left:0;right:0;text-align:center;font-size:10px;color:#b6c2d077;letter-spacing:.1em;margin:0}@media(max-width:520px){.preview{padding:25px 25px 130px}.preview-header{font-size:10px}.preview-header span:last-child{font-size:9px}.preview-content{min-height:calc(100svh - 190px)}.preview-country{font-size:11px}.preview-name{font-size:33px;letter-spacing:.13em}.preview-note{font-size:10px}.preview-hint{font-size:9px;bottom:100px}.preview-orbit{width:620px;height:620px}}@media(prefers-reduced-motion:reduce){.preview{transition:none}}
    .preview-flag{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:.62}.preview[data-country=orlania] .preview-flag{display:block}.preview[data-country=orlania]:after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#09182bb0,#09182b66),linear-gradient(0deg,#09182b99,transparent 70%);pointer-events:none}.preview-header a{color:#d5dce7;text-decoration:none;border-bottom:1px solid #d5dce755;padding-bottom:4px}.preview[data-country=orlania] .preview-note{color:#c1ccdc}.preview[data-country=orlania] .preview-orbit{display:none}
  </style>
</head>
<body>
  <main class="preview" id="preview" data-country="independent" data-faction="eternal-astrology">
    <header class="preview-header"><span id="preview-header-label">CELESTIAN</span><a id="preview-flag-link" href="/orlania-flags.html" hidden>奥兰尼亚 · 国旗提案 ↗</a></header>
    <img class="preview-flag" id="preview-flag" src="/orlania-flags/01-white-iris-union.svg" alt="" aria-hidden="true">
    <div class="preview-orbit" aria-hidden="true"></div>
    <svg class="preview-stars" id="preview-stars" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" aria-hidden="true"></svg>
    <section class="preview-content" id="preview-content" aria-label="当前势力" hidden><p class="preview-country" id="preview-country"></p><h1 class="preview-name" id="preview-name"></h1><p class="preview-note" id="preview-note"></p></section>
    <section class="astrology-view" id="astrology-view" aria-labelledby="astrology-title">
      <div class="astrology-scroll" role="region" aria-label="作为背景的四幕寓言">
        <div class="astrology-columns">
          <figure class="astrology-column">
            <div class="astrology-art"><img src="/eternal-astrology/01-garden-v1.webp" width="948" height="1659" decoding="async" fetchpriority="high" alt="金色太阳与完整星穹下，古城、果园和麦田繁盛，人们采摘与收获。"></div>
            <figcaption class="astrology-caption"><span class="astrology-chapter-number" aria-hidden="true">I</span><div><h2>长昼之庭</h2><p>麦穗饱满，群星各守其位。</p></div></figcaption>
          </figure>
          <figure class="astrology-column">
            <div class="astrology-art"><img src="/eternal-astrology/02-riven-sky-v1.webp" width="948" height="1659" decoding="async" alt="古城上空的星图天幕被撕开，披袍的人们举着灯，仰望巨大的黑色裂隙。"></div>
            <figcaption class="astrology-caption"><span class="astrology-chapter-number" aria-hidden="true">II</span><div><h2>天幕之罅</h2><p>直到天穹，裂开第一道缝。</p></div></figcaption>
          </figure>
          <figure class="astrology-column">
            <div class="astrology-art"><img src="/eternal-astrology/03-falling-stars-v1.webp" width="948" height="1659" decoding="async" alt="燃烧的星石坠向大地，古城崩裂、田野燃烧，人们护着提灯沿山脊离开。"></div>
            <figcaption class="astrology-caption"><span class="astrology-chapter-number" aria-hidden="true">III</span><div><h2>群星坠野</h2><p>昔日的光，成了遍野的火。</p></div></figcaption>
          </figure>
          <figure class="astrology-column">
            <div class="astrology-art"><img src="/eternal-astrology/04-night-voyage-v1.webp" width="948" height="1659" decoding="async" alt="木帆舟载着幸存者、幼苗和不灭的灯火，越过旧世界破碎的边缘，航入群星之海。"></div>
            <figcaption class="astrology-caption"><span class="astrology-chapter-number" aria-hidden="true">IV</span><div><h2>渡夜之舟</h2><p>他们携灯，驶向无岸之海。</p></div></figcaption>
          </figure>
        </div>
      </div>
      <div class="astrology-presence">
        <img class="astrology-emblem" src="/eternal-astrology/emblem-study-v1.svg" width="166" height="480" alt="占星会概念徽记：星芒垂弦" decoding="async">
        <h1 class="astrology-title" id="astrology-title">永恒不灭的占星会</h1>
        <p class="astrology-subtitle" aria-hidden="true">永恒不灭的占星会</p>
      </div>
    </section>
    <p class="preview-hint">点击下方势力名称，展开目录</p>
  </main>
  <script type="module" src="/src/faction-switcher-preview.js"></script>
</body>
</html>
