<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='30'%3E✧%3C/text%3E%3C/svg%3E">
  <title>伊洛薇恩 · 动态立绘</title>
</head>
<body>
  <main class="elowen-study profile">
    <div class="profile-galaxy" id="elowen-sky" aria-hidden="true"></div>
    <div class="portrait-band" aria-hidden="true"></div>
    <header class="study-header">
      <a href="/character-profile.html"><span aria-hidden="true">↶</span> 返回角色页</a>
      <span class="study-label">众生录 <i>／</i> 动态立绘试作</span>
    </header>
    <section class="study-identity" aria-label="人物身份">
      <span class="identity-star" aria-hidden="true">✧</span>
      <p class="identity-kicker">奥兰尼亚 · 秩序</p>
      <h1>伊洛薇恩</h1>
      <p class="identity-title">吾之所言即为正义</p>
      <div class="identity-line" aria-hidden="true"></div>
      <p class="identity-caption">微风掠过发梢，<br>审判者静候下一句证词。</p>
    </section>
    <div class="elowen-art" id="elowen-art">
      <img id="elowen-fallback" src="/character-profile/redraws/elowen-v5.png" alt="伊洛薇恩与停在手上的乌鸦">
      <canvas id="elowen-canvas" aria-label="自动循环的伊洛薇恩动态立绘" hidden></canvas>
    </div>
    <footer class="study-footer">
      <div class="playback-label"><span class="status-dot" aria-hidden="true"></span><span id="motion-status" role="status">正在准备动态立绘…</span></div>
      <div class="study-actions">
        <button id="original-toggle" aria-pressed="false" disabled>对比原图</button>
        <span class="action-divider" aria-hidden="true"></span>
        <button id="motion-toggle" aria-pressed="false" disabled>暂停</button>
      </div>
    </footer>
  </main>
  <script type="module" src="/src/elowen-motion.js"></script>
</body>
</html>
