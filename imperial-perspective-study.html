<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>拱门透视校准 · 帝国骑士团</title>
  <link rel="stylesheet" href="/src/imperial-perspective-study.css">
</head>
<body>
  <header class="study-header">
    <div><span class="eyebrow">IMPERIAL HALL / GEOMETRY STUDY</span><h1>拱门透视校准 <span>01</span></h1></div>
    <a href="/imperial-knights.html#hall" target="_blank" rel="noopener">查看正式页面 ↗</a>
  </header>
  <main class="workspace">
    <section class="viewer" aria-label="背景与方形标板对照">
      <nav id="arch-tabs" class="arch-tabs" aria-label="选择拱门"></nav>
      <div class="canvas-toolbar">
        <div class="view-buttons"><button id="overview" aria-pressed="true">全景</button><button id="focus" aria-pressed="false">放大当前拱门</button><button id="detail" aria-pressed="false">顶部细节</button></div>
        <span id="view-label">1672 × 941 · 原图坐标</span>
      </div>
      <div class="canvas-wrap">
        <svg id="scene" viewBox="0 0 1672 941" aria-label="五个拱门、描线与方形标板">
          <defs><clipPath id="study-view-crop"><rect id="view-crop" x="0" y="0" width="1672" height="941"/></clipPath></defs>
          <g clip-path="url(#study-view-crop)">
          <image href="/imperial-knights/hall-v1/hall.webp" width="1672" height="941"/>
          <g id="wall-layer"></g><g id="panel-layer"></g><g id="guide-layer"></g><g id="handle-layer"></g>
          </g>
        </svg>
      </div>
      <div class="legend"><span><i class="wall-key"></i>青线 · 墙面与内拱轮廓</span><span><i class="panel-key"></i>彩色网格 · 1∶1 方形标板</span><span><i class="pin-key"></i>红点 · 悬挂点</span><span><i class="dash-key"></i>虚线 · 标板侧边延长线</span></div>
      <p class="viewer-note">先对齐建筑边线，再检查标板。方形经过透视投影后可以呈梯形；细虚线用于看清侧边的收敛方向。</p>
    </section>
    <aside class="inspector">
      <div class="inspector-heading"><span class="eyebrow">SELECTED ARCH</span><h2 id="arch-name"></h2><p id="arch-note"></p></div>
      <div class="display-options">
        <label><input id="show-walls" type="checkbox" checked>建筑描线</label>
        <label><input id="show-grid" type="checkbox" checked>方形网格</label>
        <label><input id="show-guides" type="checkbox" checked>侧边延长线</label>
        <label><input id="show-panels" type="checkbox" checked>方形标板</label>
      </div>
      <section class="edit-section"><h3>墙面基准四角</h3><p>沿内侧石墙的直边取点。可拖动青色圆点，也可输入原图坐标。</p><div id="point-fields" class="point-fields"></div></section>
      <section class="edit-section"><h3>悬挂点</h3><div id="pin-fields" class="point-fields"></div></section>
      <section class="edit-section panel-settings"><h3>标板位置</h3><label>横向位置 <input id="panel-center" type="range" min="0.35" max="0.65" step="0.005"><output id="center-value"></output></label><label>上下位置 <input id="panel-top" type="range" min="-0.12" max="0.4" step="0.005"><output id="top-value"></output></label><label>相对宽度 <input id="panel-size" type="range" min="0.45" max="0.95" step="0.005"><output id="size-value"></output></label></section>
      <div class="measurements" id="measurements"></div>
      <div class="actions"><button id="reset">重置当前拱门</button><button id="export" class="primary">导出校准参数 ↓</button></div>
      <p class="save-status" id="save-status" role="status">独立校准页 · 调整仅保存在本机浏览器</p>
      <p class="calibration-note">描线是根据原画人工识别的初始参照，仍可微调。原画局部并非严格几何；此处先统一每个壁龛的投影方向。</p>
    </aside>
  </main>
  <script type="module" src="/src/imperial-perspective-study.js"></script>
</body>
</html>
