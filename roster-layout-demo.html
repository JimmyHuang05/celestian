<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星盘头像 · 四种布局</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080f1b;color:#d7c9ac;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}header{padding:22px 3vw 16px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:20px;letter-spacing:3px;font-weight:500;margin:0}header p{font-size:12px;color:#8390a3;margin:3px 0 0}button,a{color:inherit;font:inherit}button{border:1px solid #a48b5a55;background:#a48b5a0c;cursor:pointer;padding:7px 14px}button:hover,button:focus-visible{border-color:#c9ad75;background:#a48b5a20}a{text-decoration:none;font-size:12px;color:#8c97a7}nav{display:flex;gap:12px;align-items:center}main{padding:0 3vw 24px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border:1px solid #a48b5a35;background:#0d1727;min-width:0;overflow:hidden}.card>button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #a48b5a25;padding:12px 18px;background:#ffffff02}.card strong{font-weight:500;letter-spacing:2px}.card small{display:block;color:#8996a9;font-size:11px;margin-top:3px}.card svg{display:block;width:100%;height:min(36vh,410px)}.card svg text{font-family:system-ui,"Microsoft YaHei",sans-serif}.focus main{grid-template-columns:1fr;max-width:1400px;margin:auto}.focus .card:not(.chosen){display:none}.focus .card svg{height:calc(100vh - 190px);min-height:420px}#all{display:none}.focus #all{display:block}@media(max-width:800px){main{grid-template-columns:1fr}.card svg{height:350px}header{align-items:flex-start}}
</style>
<header><div><h1>星盘与人物入口</h1><p>四种布局草案 · 只看形状、连接与层级 · 点击方案标题放大</p></div><nav><button id="all">全部方案</button><a href="/character-profile.html">返回角色页 ↗</a></nav></header>
<main id="grid"></main>
<script>
const gold='#b69c69',light='#d9c399';
const polar=(r,a)=>[-100+r*Math.cos(a*Math.PI/180),210+r*Math.sin(a*Math.PI/180)];
const xy=p=>p.map(v=>v.toFixed(2)).join(' ');
const dot=(x,y,r=3)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${gold}"/>`;
const line=(a,b,opacity=.5)=>`<path d="M${xy(a)}L${xy(b)}" stroke="${gold}" opacity="${opacity}" fill="none"/>`;
function bust(x,y,size,active=false){return `<g transform="translate(${x} ${y})" fill="${active?'#b9b7b0':'#717d8e'}"><ellipse cy="${-size*.13}" rx="${size*.14}" ry="${size*.18}"/><path d="M${-size*.31} ${size*.37}Q${-size*.29} ${size*.11} ${-size*.13} ${size*.08}Q0 ${size*.15} ${size*.13} ${size*.08}Q${size*.29} ${size*.11} ${size*.31} ${size*.37}Z"/></g>`}
function medallion(x,y,size,active=false,shape='circle'){
 const r=size/2,form=shape==='diamond'?`<path d="M0 ${-r}L${r} 0L0 ${r}L${-r} 0Z"/>`:`<circle r="${r}"/>`;
 return `<g transform="translate(${x} ${y})"><g stroke="${active?light:gold}" fill="#111e30" stroke-width="${active?1.4:.8}">${form}<g transform="scale(.88)" opacity=".45">${form}</g></g>${bust(0,0,size,active)}${active?`<path d="M${-r-7} -12V12M${r+7} -12V12" fill="none" stroke="${gold}"/>`:''}</g>`;
}
function dial(){return `<g fill="none" stroke="${gold}" opacity=".38">${[340,333,326,290,228,221,135].map(r=>`<circle cx="-100" cy="210" r="${r}"/>`).join('')}${Array.from({length:61},(_,i)=>{let a=i*3-90;return line(polar(i%5?330:319,a),polar(337,a),i%5?.5:1)}).join('')}${[-60,-30,0,30,60].map(a=>line(polar(135,a),polar(225,a),.35)).join('')}</g>`}
function context(){return `<g opacity=".32"><path d="M380 395Q382 272 403 213Q410 188 427 181Q446 176 455 196Q482 237 490 395Z" fill="#364254"/><ellipse cx="434" cy="140" rx="30" ry="38" fill="#475365"/><path d="M361 29H490M361 43H433" stroke="#9b8a68"/><text x="362" y="72" fill="#a7b0be" font-size="12" letter-spacing="3">角色立绘区域</text><path d="M525 97H591M525 110H569M525 164H590M525 178H587M525 192H577M525 206H589M525 220H564" stroke="#6f7c90"/></g>`}
const name=(x,y,label,active=false)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="${active?12:10}" letter-spacing="2" fill="${active?light:'#7c899a'}">${label}</text>`;
const names=['希尔维娅','尤菲米娅','汐安娜'];
const slots=[-31,0,31].map(a=>polar(290,a));
function a(){return slots.map(([x,y],i)=>{let active=i===1,s=active?94:66;return medallion(x,y,s,active)+dot(x-s/2-3,y,2)+dot(x+s/2+3,y,2)+(active?`<circle cx="${x}" cy="${y}" r="55" stroke="${gold}" stroke-dasharray="1 5" fill="none"/>`:'')+name(x,y+s/2+21,names[i],active)}).join('')+line([248,210],[274,210])+`<path d="M272 205L279 210L272 215" fill="none" stroke="${light}"/>`}
function sector(a,r1=244,r2=333,spread=11){return `M${xy(polar(r1,a-spread))}L${xy(polar(r2,a-spread))}A${r2} ${r2} 0 0 1 ${xy(polar(r2,a+spread))}L${xy(polar(r1,a+spread))}A${r1} ${r1} 0 0 0 ${xy(polar(r1,a-spread))}Z`}
function b(){return [-31,0,31].map((angle,i)=>{let [x,y]=polar(287,angle),active=i===1;return `<path d="${sector(angle)}" fill="${active?'#253041':'#111d2e'}" stroke="${active?light:gold}" stroke-width="${active?1.5:.7}"/><path d="${sector(angle,250,327,9.6)}" fill="none" stroke="${gold}" opacity=".3"/>${bust(x,y,active?96:76,active)}${name(x+109,y+4,names[i],active)}`}).join('')}
function c(){return slots.map(([x,y],i)=>{let active=i===1;return dot(x,y,active?5:3)+`<circle cx="${x}" cy="${y}" r="${active?12:7}" fill="none" stroke="${gold}" opacity=".6"/>`+(active?line([x+12,y],[x+38,y])+medallion(x+85,y,92,true)+name(x+85,y+68,names[i],true):line([x+9,y],[x+43,y])+name(x+77,y+4,names[i]))}).join('')}
function d(){return slots.map(([x,y],i)=>{let active=i===1,s=active?93:66;return `<circle cx="${x}" cy="${y}" r="${s*.64}" fill="#0d1727" stroke="${gold}" opacity=".65"/>`+medallion(x,y,s,active,'diamond')+[-90,0,90,180].map(angle=>{let r=s*.58,t=angle*Math.PI/180;return dot(x+Math.cos(t)*r,y+Math.sin(t)*r,2)}).join('')+name(x,y+s*.64+18,names[i],active)}).join('')}
const options=[['A · 轨道徽章','圆形肖像嵌入轨道，细刻度环强调当前角色。',a],['B · 扇区嵌窗','头像直接装在环形扇区中，整个圆环成为选择器。',b],['C · 星座节点','轨道只留星点，当前角色展开肖像，其他角色收为姓名。',c],['D · 菱形镶座','保留菱形，但收进圆形安装座，用连接铆点统一结构。',d]];
document.querySelector('#grid').innerHTML=options.map(([title,desc,draw])=>`<article class="card"><button aria-expanded="false"><strong>${title}</strong><small>${desc}</small></button><svg viewBox="0 -10 620 450" role="img" aria-label="${title}布局草案">${context()}${dial()}${draw()}</svg></article>`).join('');
document.querySelectorAll('.card>button').forEach(button=>button.onclick=()=>{document.querySelectorAll('.card').forEach(c=>{c.classList.remove('chosen');c.querySelector('button').setAttribute('aria-expanded','false')});button.parentElement.classList.add('chosen');button.setAttribute('aria-expanded','true');document.body.classList.add('focus');window.scrollTo(0,0)});
const reset=()=>{document.body.classList.remove('focus');document.querySelectorAll('.card>button').forEach(b=>b.setAttribute('aria-expanded','false'))};document.querySelector('#all').onclick=reset;document.addEventListener('keydown',e=>{if(e.key==='Escape')reset()});
</script>
</html>
