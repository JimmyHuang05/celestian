<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eeede8">
  <title>奥兰尼亚 · 五种旗帜提案</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 20'%3E%3Cpath fill='%2318345A' d='M0 0h30v20H0z'/%3E%3Cpath fill='%23F7F5EF' d='M0 8h30v4H0z'/%3E%3Cpath fill='%23B3263E' d='M13 0h4v20h-4z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/src/orlania-flags.css">
</head>
<body>
  <div class="flag-workspace">
    <header class="study-header"><a href="/faction-switcher.html">CELESTIAN <span>/ 势力与国家</span></a><span>旗帜设计提案 · 01—05</span></header>
    <main>
      <div class="study-heading"><div><p class="eyebrow">奥兰尼亚 · 国家视觉</p><h1>让一个国家，先被一面旗记住。</h1></div><p class="intro">海上的影响力，陆上的王国传统。<br>红、白、蓝，五种不同的奥兰尼亚。</p></div>
      <nav class="flag-options" aria-label="选择国旗方案" id="flag-options"></nav>
      <section class="selected-design" aria-label="当前国旗提案">
        <div class="flag-view">
          <div class="view-toolbar"><div class="view-modes" aria-label="预览方式"><button type="button" data-mode="original" aria-pressed="true">旗面原稿</button><button type="button" data-mode="background" aria-pressed="false">势力背景</button></div><span id="view-caption">3:2 · 纯色矢量</span></div>
          <div class="flag-stage" id="flag-stage" data-mode="original">
            <img id="selected-flag" src="/orlania-flags/01-white-iris-union.svg" alt="白鸢联旗">
            <div class="office-preview" id="office-preview" hidden><p>奥兰尼亚</p><h2>非常规事务署</h2><span>国旗背景效果预览</span></div>
          </div>
          <p class="stage-note" id="stage-note">旗面使用三种纯色；阴影仅用于展示，不包含在 SVG 中。</p>
        </div>
        <div class="design-description" aria-live="polite">
          <p class="design-number" id="design-number">01 / 联合王国</p><h2 id="design-name">白鸢联旗</h2><p class="design-lead" id="design-lead"></p>
          <dl><div><dt>构图</dt><dd id="design-form"></dd></div><div><dt>寓意建议</dt><dd id="design-meaning"></dd></div><div><dt>性格</dt><dd id="design-character"></dd></div></dl>
          <p class="design-verdict" id="design-verdict"></p>
          <div class="design-actions"><a id="download-svg" class="download-link" href="/orlania-flags/01-white-iris-union.svg" download>下载这一版 SVG <span aria-hidden="true">↗</span></a><a id="office-link" class="office-link" href="/faction-switcher.html?faction=unconventional-affairs&flag=1">放进势力切换页 →</a></div>
        </div>
      </section>
      <footer class="study-footer"><div class="palette" aria-label="统一色板"><span><i style="--swatch:#B3263E"></i>绯红 <code>#B3263E</code></span><span><i style="--swatch:#F7F5EF"></i>旗白 <code>#F7F5EF</code></span><span><i style="--swatch:#18345A"></i>深蓝 <code>#18345A</code></span></div><p>全部为独立 SVG · 900 × 600 · 图案寓意尚未纳入正式设定</p></footer>
    </main>
  </div>
  <script type="module" src="/src/orlania-flags.js"></script>
</body>
</html>
