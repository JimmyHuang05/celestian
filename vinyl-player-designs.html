<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111413">
  <title>黑胶播放器 · 六款设计</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/src/vinyl-player-designs.css">
</head>
<body>
  <header class="workshop-header"><a href="/encyclopedia/" class="wordmark">CELESTIAN <span>无光的伊甸园</span></a><span class="edition">SOUND OBJECTS <i></i> DESIGN STUDY</span></header>
  <main class="workshop">
    <section class="introduction">
      <div><p class="eyebrow">贯穿世界的一枚唱片</p><h1>黑胶与唱片匣<span>六款设计</span></h1><p class="intro-copy">唱片高于横条，横条从圆心向右展开。<br>保留同一种轮廓，试试六种不同的材质与气质。</p></div>
      <div class="silhouette" aria-hidden="true"><div class="silhouette-bar"></div><div class="silhouette-disc"></div><span>THE RECORD & THE SLEEVE</span></div>
    </section>
    <section class="workbench" aria-label="对比设置">
      <div class="mode-group" aria-label="面板展示模式"><button type="button" data-mode="open" aria-pressed="true">展开对比</button><button type="button" data-mode="hover" aria-pressed="false">悬停体验</button></div>
      <div class="track-picker"><label for="preview-track">试听曲目</label><select id="preview-track"><option value="imperial-knights">五军同盟</option><option value="unconventional-affairs">非常规事务署</option><option value="eternal-astrology">永恒不灭的占星会</option></select></div>
      <p class="audio-status" aria-live="polite">点击任意播放键试听</p>
    </section>
    <section class="design-grid" id="design-grid" aria-label="六款黑胶播放器"></section>
    <footer class="workshop-footer"><span>点击黑胶可展开或收起 · 播放、进度和音量可操作</span><span>所有款式共用一首音乐，方便比较。</span></footer>
  </main>
  <dialog class="scene-dialog" aria-label="播放器在势力页中的效果">
    <div class="scene-backdrop"></div><div class="scene-vignette"></div>
    <header class="scene-toolbar"><div><span class="scene-eyebrow">左下角场景预览</span><strong class="scene-design-name"></strong></div><div class="scene-options"><label for="scene-select">背景</label><select id="scene-select"><option value="imperial">五军同盟</option><option value="astrology">占星会</option><option value="affairs">事务署</option></select><button type="button" class="scene-close" aria-label="关闭场景预览"></button></div></header>
    <div class="scene-caption"><span>霍亨泰因帝国</span><p>五军同盟</p><i>✦</i></div>
    <div class="scene-player-slot"></div>
    <div class="scene-switcher" aria-label="切换设计"><button type="button" class="scene-prev" aria-label="上一款设计"></button><span class="scene-count"></span><button type="button" class="scene-next" aria-label="下一款设计"></button></div>
  </dialog>
  <script type="module" src="/src/vinyl-player-designs.js"></script>
</body>
</html>
