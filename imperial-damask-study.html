<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>五旗织锦 · 暗纹对照</title>
<link rel="stylesheet" href="/src/fonts/faction-song.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#e7e3da;color:#302f2b;font-family:'Celestian Faction Song','Songti SC',SimSun,serif}button,a{font:inherit;color:inherit}button{cursor:pointer}a{text-decoration:none}button:focus-visible,a:focus-visible{outline:2px solid #75684b;outline-offset:4px}
main{width:min(1320px,94vw);margin:26px auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #4b453629;padding-bottom:20px}.eyebrow{font:10px Georgia,serif;letter-spacing:.2em;color:#81796b;margin:0 0 8px}h1{font-size:22px;letter-spacing:.12em;font-weight:400;margin:0}header a{font-size:12px;color:#6a6255}.controls{display:flex;justify-content:space-between;gap:22px;align-items:center;margin:20px 0}.choices{display:flex;gap:7px;flex-wrap:wrap}.choices button,.zoom-toggle{background:transparent;border:1px solid #4b453630;padding:10px 16px;font-size:12px}.choices [aria-pressed="true"]{background:#383b36;color:#f0e6d3;border-color:#383b36}.zoom-toggle{white-space:nowrap}h2{font-size:16px;font-weight:400;letter-spacing:.12em;margin:0 0 17px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}.window{height:65svh;min-height:360px;background:#1b211f;position:relative;overflow:hidden;border:1px solid #b2a89555}.window img{display:block;width:100%;height:100%;object-fit:contain}body.detail .window{height:57svh;max-height:570px}body.detail .window img{position:absolute;left:0;top:0;width:360%;height:auto;max-width:none;transform:translate(-15%,-59%);object-fit:fill}figcaption{display:flex;align-items:center;gap:10px;padding:13px 0;font-size:13px;letter-spacing:.1em}figcaption small{font-size:10px;letter-spacing:.02em;color:#81796b}footer{border-top:1px solid #4b453629;margin-top:16px;padding-top:15px;font-size:12px;color:#777062;line-height:1.9}
@media(max-width:680px){main{margin:18px auto}.controls{align-items:flex-start;gap:8px}.choices button,.zoom-toggle{font-size:11px;padding:8px 10px}h1{font-size:18px}.compare{grid-template-columns:1fr;gap:20px}.window{height:68svh}body.detail .window{height:42svh;min-height:250px}figcaption small{display:none}h2{font-size:14px}header a{font-size:10px}}
</style>
</head>
<body class="detail">
<main>
<header><div><p class="eyebrow">CELESTIAN / JACQUARD STUDY</p><h1>五旗织锦 · 暗纹对照</h1></div><a href="/imperial-knights.html">返回五旗页面 ↗</a></header>
<div class="controls"><div class="choices" role="group" aria-label="选择战旗"></div><button class="zoom-toggle" type="button" aria-pressed="true">查看完整战旗</button></div>
<h2 id="motif"></h2>
<section class="compare" aria-label="原版与织锦暗纹版对比">
<figure><div class="window"><img id="before" alt="原版战旗"></div><figcaption>原版 <small>既有布料纹理</small></figcaption></figure>
<figure><div class="window"><img id="after" alt="专属暗纹版战旗"></div><figcaption>专属暗纹版 <small>同色织锦 · 随褶皱明暗显现</small></figcaption></figure>
</section>
<footer>暗纹只覆盖布面，中央纹章与金属装饰保持原样。可以切换近景与完整战旗，观察细节和远看时的克制程度。</footer>
</main>
<script type="module">
const designs=await(await fetch('/imperial-knights/damask-v1/manifest.json')).json();
const choices=document.querySelector('.choices');
for(const item of designs){const button=document.createElement('button');button.type='button';button.dataset.id=item.id;button.textContent=item.name;button.setAttribute('aria-pressed','false');button.addEventListener('click',()=>select(item));choices.append(button)}
function select(item){document.querySelector('#before').src=item.source;document.querySelector('#before').alt=item.name+'原版';document.querySelector('#after').src=item.artwork;document.querySelector('#after').alt=item.name+'专属暗纹版';document.querySelector('#motif').textContent=item.name+' ／ '+item.motif;for(const b of choices.children)b.setAttribute('aria-pressed',String(b.dataset.id===item.id))}
document.querySelector('.zoom-toggle').addEventListener('click',function(){const detail=document.body.classList.toggle('detail');this.setAttribute('aria-pressed',String(detail));this.textContent=detail?'查看完整战旗':'放大布面细节'});
select(designs.find(item=>item.id==='imperial'));
</script>
</body>
</html>
