<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#161a17">
  <title>卫兵站位与光照校准 · 帝国骑士团</title>
  <link rel="stylesheet" href="/src/imperial-guard-study.css">
</head>
<body>
  <header class="study-header"><div><p class="eyebrow">IMPERIAL HALL / GUARD STUDY</p><h1>卫兵校准</h1></div><a href="/imperial-knights.html#hall" target="_blank" rel="noopener">查看正式页面 ↗</a></header>
  <main class="workspace">
    <section class="viewer" aria-label="大厅实时预览">
      <nav id="guard-tabs" class="guard-tabs" aria-label="选择卫兵"></nav>
      <div class="toolbar"><div class="view-modes"><button data-view="hall" aria-pressed="true">大厅全景</button><button data-view="floor" aria-pressed="false">柱脚整排</button><button data-view="guard" aria-pressed="false">放大当前</button></div><label class="guide-toggle"><input id="show-handles" type="checkbox" checked>显示控制框</label></div>
      <div id="viewport" class="viewport" aria-label="拖动卫兵调整站位">
        <p id="loading" role="status">正在载入大厅…</p>
        <div id="artboard" class="artboard"><iframe id="hall-frame" src="/imperial-knights.html?guard-study=1" title="卫兵校准用大厅" tabindex="-1"></iframe><div id="handles" class="handles"></div></div>
      </div>
      <div class="viewer-footer"><p>拖动人物移动 · 方向键微调 · Shift + 方向键移动 10 格</p><div><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button></div></div>
    </section>
    <aside class="inspector" aria-label="卫兵参数">
      <p class="eyebrow">SELECTED GUARD</p><h2 id="selected-title">载入中</h2><p id="selected-description" class="muted">从左到右 B · B · A · A · B · B</p>
      <fieldset id="controls" disabled>
        <legend>站位</legend>
        <div class="control"><label for="x-range">左右位置 <small>← 左 / 右 →</small></label><div class="control-row"><input id="x-range" data-key="x" type="range" min="0" max="1672" step=".5"><input id="x-number" data-key="x" type="number" min="0" max="1672" step=".5" aria-label="左右位置数值"></div></div>
        <div class="control"><label for="y-range">落脚位置 <small>↑ 上 / 下 ↓</small></label><div class="control-row"><input id="y-range" data-key="y" type="range" min="0" max="941" step=".5"><input id="y-number" data-key="y" type="number" min="0" max="941" step=".5" aria-label="落脚位置数值"></div></div>
        <div class="nudge" role="group" aria-label="站位微调"><button data-dx="-1" data-dy="0" aria-label="向左移动">←</button><button data-dx="0" data-dy="-1" aria-label="向上移动">↑</button><button data-dx="0" data-dy="1" aria-label="向下移动">↓</button><button data-dx="1" data-dy="0" aria-label="向右移动">→</button><span>每次 1 格</span></div>
        <div class="section-rule"></div><h3 class="section-label">大小与明暗</h3>
        <div class="control"><label for="height-range">人物高度 <small>以落脚点为基准缩放</small></label><div class="control-row"><input id="height-range" data-key="height" type="range" min="36" max="320" step="1"><input id="height-number" data-key="height" type="number" min="36" max="320" step="1" aria-label="人物高度数值"></div></div>
        <div class="control"><label for="brightness-range">明暗度 <output id="brightness-label"></output></label><div class="control-row"><input id="brightness-range" data-key="brightness" type="range" min="25" max="200" step="1"><input id="brightness-number" data-key="brightness" type="number" min="25" max="200" step="1" aria-label="明暗度百分比"></div></div>
        <label class="linked"><input id="link-guards" type="checkbox">联动六名卫兵的大小与明暗</label><p class="hint">联动按比例调整，保留各自的明暗差异。站位始终只移动当前卫兵。</p>
        <button id="reset-current" class="reset-current">恢复这名卫兵的初始设置</button>
      </fieldset>
      <div class="save-panel"><span class="status-dot"></span><p id="save-status" role="status">调整会自动保存在此浏览器</p><small>这是独立校准页。确认效果后，可导出配置应用到正式页面。</small></div>
      <div class="actions"><button id="export" class="primary" disabled>导出配置 ↓</button><button id="copy" disabled>复制配置</button></div>
      <div class="secondary-actions"><label class="import-button" for="import-file">导入配置</label><input id="import-file" type="file" accept="application/json,.json" hidden><button id="reset-all" disabled>全部恢复初始值</button></div>
      <details><summary>查看当前配置</summary><textarea id="config-output" readonly aria-label="当前卫兵配置" spellcheck="false"></textarea></details>
    </aside>
  </main>
  <script type="module" src="/src/imperial-guard-study.js"></script>
</body>
</html>
