<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#151719" />
  <title>留影 · 图文融合设计</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23151719'/%3E%3Cpath d='M8 12h24v16H8zM15 8v24M25 8v24' fill='none' stroke='%23c8b38e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/src/gallery-concepts.css" />
  <link rel="stylesheet" href="/src/gallery-fusion.css" />
  <link rel="stylesheet" href="/src/gallery-reader.css" />
</head>
<body>
  <a class="skip" href="#stage">跳至方案内容</a>
  <header class="studio" aria-label="设计方案控制栏">
    <div class="studio-identity"><a href="/gallery-concepts.html" class="studio-brand" aria-label="留影设计方案首页"><span class="brand-mark">◈</span><span>留影<span class="brand-en">DESIGN STUDIES</span></span></a><button class="series-toggle" data-action="series" aria-label="查看第一组方案">Ⅱ · 融合新稿 ⇄</button></div>
    <nav class="concept-tabs" aria-label="选择设计方案">
      <button data-concept="1" aria-pressed="true"><small>01</small> 银幕</button>
      <button data-concept="2" aria-pressed="false"><small>02</small> 对页</button>
      <button data-concept="3" aria-pressed="false"><small>03</small> 映界</button>
      <button data-concept="4" aria-pressed="false"><small>04</small> 图志</button>
      <button data-concept="5" aria-pressed="false"><small>05</small> 长卷</button>
    </nav>
    <div class="studio-actions">
      <label class="scene-select"><span class="sr-only">选择留影场景</span><select id="scene-select" aria-label="选择留影场景"><option>载入场景…</option></select></label>
      <button class="studio-icon" data-action="overview" aria-label="全部方案总览" title="全部方案总览">▦</button>
      <button class="studio-icon" data-action="preview" aria-label="隐藏方案栏，纯净预览" title="隐藏方案栏，纯净预览">↗</button>
    </div>
  </header>
  <main id="stage" tabindex="-1" aria-label="留影方案预览"><div class="loading">正在展开留影…</div></main>
  <button class="restore" data-action="preview" hidden>↙ 返回方案切换</button>
  <dialog id="reader" class="reader-dialog" aria-labelledby="reader-title">
    <div class="reader-landscape" aria-hidden="true"><img alt="" /><div class="reader-wash"></div></div>
    <header class="reader-masthead"><span>CELESTIAN <i>/</i> CHRONICLES</span><span class="reader-edition"></span></header>
    <button data-action="close" class="reader-close" aria-label="关闭详情"><span>返回风景</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg></button>
    <div class="reader-layout">
      <header class="reader-scene">
        <span class="reader-english"></span>
        <h2 id="reader-title" tabindex="-1"></h2>
        <p class="reader-subtitle"></p>
        <div class="reader-place"><span>地点</span><p></p></div>
      </header>
      <section class="reader-story" tabindex="0" aria-label="完整纪事">
        <div class="reader-story-heading"><span>场景纪事</span><i></i><small>CHRONICLE</small></div>
        <div class="reader-copy prose"></div>
        <footer class="reader-colophon"><span></span><small>CELESTIAN · 留影</small><span></span></footer>
      </section>
    </div>
  </dialog>
  <dialog id="viewer" class="viewer-dialog" aria-label="完整插图">
    <button data-action="close" class="round-button viewer-close" aria-label="关闭完整插图">×</button><img alt="" /><p>完整插图 <span>ESC 关闭</span></p>
  </dialog>
  <dialog id="overview" class="overview-dialog" aria-labelledby="overview-title">
    <header><div><span class="eyebrow">STUDIES IN COMPOSITION</span><h2 id="overview-title">让文字与风景，成为同一幅画。</h2></div><button data-action="close" class="round-button" aria-label="关闭方案总览">×</button></header>
    <div class="overview-grid"></div><footer>第一组 01–05 / 第二组 06–10 · 图片容器 21:9 · 数字键 1–5 切换当前组方案</footer>
  </dialog>
  <p id="announcement" class="sr-only" aria-live="polite"></p>
  <script type="module" src="/src/gallery-concepts.js"></script>
</body>
</html>
