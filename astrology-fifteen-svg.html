<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>占星会 · 十五款 SVG 徽记</title>
<style>
@font-face{font-family:Celestian;src:url('/src/fonts/identity/noto-serif-sc-400.ttf');font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#090b0c;color:#ece5d6;font-family:Celestian,'Songti SC',serif}main{max-width:1750px;margin:auto;padding:42px 4vw 30px}.eyebrow{font:10px Georgia,serif;letter-spacing:.25em;color:#b1a18a;margin:0 0 15px}h1{font-size:32px;font-weight:400;letter-spacing:.12em;margin:0 0 14px}.intro{font-size:12px;line-height:2;color:#a9a59c;margin:0}header{margin-bottom:26px}.toolbar{position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:15px 0;background:#090b0cf2;border-bottom:1px solid #b5a27c33;backdrop-filter:blur(12px)}button,.zip{border:1px solid #b6a17a55;background:#141616;color:#e8decb;padding:9px 15px;font:12px Celestian,serif;cursor:pointer;text-decoration:none}button:hover,.zip:hover{border-color:#e1cda3}button[aria-pressed=true]{background:#d5c6aa;color:#161616}.zip{margin-left:auto}button:focus-visible,a:focus-visible{outline:2px solid #d2bc91;outline-offset:4px}.group{margin-top:38px}.group-title{font-size:17px;font-weight:400;letter-spacing:.12em;display:flex;gap:20px;align-items:center;margin:0 0 22px}.group-title span{font:10px Georgia,serif;color:#9a8c73;letter-spacing:.15em}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}.card{min-width:0}.art{border:1px solid #b9aa8d20;display:block;aspect-ratio:1;width:100%;padding:8px;background:#111416;cursor:zoom-in}.art img{width:100%;height:100%;object-fit:contain;display:block}.light .art{background:#777a7c}.caption{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:15px}.caption h3{font-size:16px;font-weight:400;letter-spacing:.08em;margin:0}.caption span{font:10px Georgia,serif;letter-spacing:.13em;color:#a09178}.download{display:inline-block;font-size:10px;text-decoration:none;color:#aca18f;margin-top:12px;padding-bottom:5px;border-bottom:1px solid #89765544}.download:hover{color:#f9eace}footer{font-size:10px;line-height:2;color:#83867f;border-top:1px solid #b5a27c33;margin-top:40px;padding-top:20px}dialog{padding:18px;background:#111416;color:#e8decb;border:1px solid #8c7c5f;width:min(950px,94vw);max-width:94vw;max-height:94svh}dialog::backdrop{background:#000d;backdrop-filter:blur(6px)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:14px}.modal-head h2{font-size:16px;font-weight:400;margin:0}.large{width:100%;height:calc(89svh - 100px);object-fit:contain;display:block}.light dialog{background:#777a7c}.light dialog .modal-head{background:#141616;padding:8px}#status{font-size:11px;color:#b4b1a6;margin-left:4px}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:28px}}@media(max-width:560px){main{padding:28px 5vw}h1{font-size:25px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px}.caption h3{font-size:14px}.toolbar{gap:8px}.zip{margin-left:0}button,.zip{padding:8px 10px}#status{width:100%}}
</style>
</head>
<body><main>
<header><p class="eyebrow">CELESTIAN / FIFTEEN CELESTIAL INSIGNIA</p><h1>占星会 · 十五款徽记</h1><p class="intro">三轮构想，一起对照。点击徽记查看大图，切换原图检查轮廓与细节。</p></header>
<nav class="toolbar" aria-label="预览选项"><button id="source-toggle" aria-pressed="false">查看 PNG 原图</button><button id="background-toggle" aria-pressed="false">浅灰底</button><span id="status" aria-live="polite">正在显示 SVG · 透明背景</span><a class="zip" href="/eternal-astrology/emblems/astrology-fifteen-svg.zip" download>下载全部 15 款 SVG ↓</a></nav>
<div id="groups"></div>
<footer>全部为透明背景的路径 SVG，可独立下载。01—05 保留彩色层次并简化颗粒纹理；06—15 为象牙白单色。PNG 原图保留黑底。</footer>
</main>
<dialog aria-labelledby="detail-title"><div class="modal-head"><h2 id="detail-title"></h2><button id="close">关闭 ×</button></div><img class="large" alt=""></dialog>
<script type="module">
const base='/eternal-astrology/emblems/';
const data=await fetch(base+'fifteen-emblems.json').then(r=>{if(!r.ok)throw new Error('无法加载徽记目录');return r.json()});
const groups=document.querySelector('#groups');
const dialog=document.querySelector('dialog');
let source='svg';
let active=null;
function updateDetail(){if(!active)return;document.querySelector('#detail-title').textContent=String(active.id).padStart(2,'0')+' · '+active.name+' / '+source.toUpperCase();const img=document.querySelector('.large');img.src=base+active.stem+'.'+source;img.alt=active.name+'徽记大图';}
for(const groupName of [...new Set(data.map(x=>x.group))]){
 const section=document.createElement('section');section.className='group';
 const entries=data.filter(x=>x.group===groupName);
 section.innerHTML='<h2 class="group-title"><span>'+String(entries[0].id).padStart(2,'0')+' — '+String(entries.at(-1).id).padStart(2,'0')+'</span>'+groupName+'</h2><div class="grid"></div>';
 for(const entry of entries){
  const article=document.createElement('article');article.className='card';
  article.innerHTML='<button class="art" aria-label="放大'+entry.name+'"><img data-stem="'+entry.stem+'" src="'+base+entry.stem+'.svg" alt="'+entry.name+'徽记"></button><div class="caption"><h3>'+entry.name+'</h3><span>'+String(entry.id).padStart(2,'0')+'</span></div><a class="download" href="'+base+entry.stem+'.svg" download="'+String(entry.id).padStart(2,'0')+'-'+entry.name+'.svg">下载 SVG ↓</a>';
  article.querySelector('button').addEventListener('click',()=>{active=entry;updateDetail();dialog.showModal()});
  section.querySelector('.grid').append(article);
 }
 groups.append(section);
}
document.querySelector('#source-toggle').addEventListener('click',event=>{
 source=source==='svg'?'png':'svg';event.currentTarget.setAttribute('aria-pressed',String(source==='png'));event.currentTarget.textContent=source==='svg'?'查看 PNG 原图':'返回 SVG 矢量';
 for(const img of document.querySelectorAll('[data-stem]'))img.src=base+img.dataset.stem+'.'+source;
 document.querySelector('#status').textContent=source==='svg'?'正在显示 SVG · 透明背景':'正在显示 PNG · 原图黑底';updateDetail();
});
document.querySelector('#background-toggle').addEventListener('click',event=>{const light=document.body.classList.toggle('light');event.currentTarget.setAttribute('aria-pressed',String(light));event.currentTarget.textContent=light?'恢复深色底':'浅灰底'});
document.querySelector('#close').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close()}});
</script></body></html>
