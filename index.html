<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
  <!-- shared-font-preload:start -->
  <link rel="preload" href="/fonts/v1/song-critical-d63e1a85af8bcdb4.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high">
  <link rel="stylesheet" href="/src/fonts/index.css">
  <!-- shared-font-preload:end -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>无光的伊甸园丨个人原创世界观展示</title>

    <link rel="icon" type="image/png" href="/data/images/icons/favicon.png">
    <script>
      if (/^\/map\/?$/.test(location.pathname)) {
        document.documentElement.dataset.mapBoot = 'true'
        const root = '/map/world-240705-base-v2'
        const geometry = /* map-boot-geometry */ null
        window.__celestianMapManifest = geometry ? Promise.resolve(geometry) : fetch(root + '/manifest.json', { priority: 'high' })
          .then(response => response.ok ? response.json() : null)
          .catch(() => null)
        // Fetch text while the application downloads, rather than after Leaflet mounts.
        // Keep raw text promises: each mount parses its own SVG, including StrictMode.
        const labelRoot = window.__celestianCompositePreview || window.__celestianTextLabelPreview
          ? '/__local-map/text-labels' : root
        window.__celestianMapLabels = { root: labelRoot,
          svg: fetch(labelRoot + '/labels.svg', { priority: 'high' }).then(r => r.ok ? r.text() : null).catch(() => null),
          index: fetch(labelRoot + '/labels-index.json', { priority: 'high' }).then(r => r.ok ? r.json() : null).catch(() => null),
        }
        const primeTile = map => {
          if (!map || window.__celestianLayeredPreview || new URLSearchParams(location.search).has('map')) return
          try {
            if (localStorage.getItem('celestian-map-view-v2')) return
          } catch { /* Storage can be unavailable on an embedded map. */ }
          const scale = 2 ** map.maxZoom
          // The default camera covers the viewport with the framed atlas.
          // Prime just the central tile, leaving saved/shared views to Leaflet.
          const coverScale = Math.max(innerWidth * (1 - 49.2 / 2232) / map.width, innerHeight * (1 - 49.2 / 1112) / map.height) * scale
          const zoom = Math.max(map.minZoom, Math.min(map.maxZoom, Math.round(Math.log2(coverScale))))
          const tileSpan = map.tileSize * 2 ** (map.maxZoom - zoom)
          const preload = document.createElement('link')
          preload.rel = 'preload'
          preload.as = 'image'
          preload.fetchPriority = 'high'
          const tileRoot = window.__celestianCompositePreview ? '/__local-map/composite' : '/map/world-240705-composite-v2'
          preload.href = tileRoot + '/' + zoom + '/' + Math.floor(map.width / (2 * tileSpan)) + '/' + Math.floor(map.height / (2 * tileSpan)) + '.webp'
          document.head.append(preload)
        }
        if (geometry) primeTile(geometry)
        else window.__celestianMapManifest.then(primeTile)
      }
    </script>

</head>
