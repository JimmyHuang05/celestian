<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101318"><title>非常规事务署 · 五版纹章</title>
  <style>
    *{box-sizing:border-box}body{--ink:#e9e3d7;--muted:#a6a59f;--line:#8e806a45;--ground:#101318;--accent:#b7a17c;margin:0;background:var(--ground);color:var(--ink);font-family:'Songti SC',SimSun,serif;transition:background .25s,color .25s}body.paper{--ink:#292d32;--muted:#656461;--line:#8e806a55;--ground:#e5e0d5;--accent:#7c6644}main{max-width:1900px;margin:auto;padding:44px 4vw 26px}header{display:flex;justify-content:space-between;gap:24px;align-items:center;padding-bottom:30px;border-bottom:1px solid var(--line)}.eyebrow{font:10px Georgia,serif;letter-spacing:.2em;color:var(--accent);margin:0 0 12px}h1{font-size:clamp(22px,2.5vw,33px);font-weight:400;letter-spacing:.1em;margin:0 0 12px}.intro{font:12px/1.8 system-ui,sans-serif;color:var(--muted);margin:0}.tools{display:flex;align-items:center;gap:24px;flex-wrap:wrap}a,button{color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:1px solid var(--accent);outline-offset:5px}a{text-decoration:none;font-size:11px}.theme{background:none;border:1px solid var(--line);padding:11px 16px;font:11px system-ui,sans-serif}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:28px;padding-top:28px}.number{font:10px Georgia,serif;letter-spacing:.18em;color:var(--accent)}.art{display:block;border:0;width:100%;padding:18px 0;background:none}.art img{width:100%;height:clamp(220px,25vw,360px);object-fit:contain;display:block;transition:transform .4s}.art:hover img{transform:translateY(-4px)}h2{font-size:19px;font-weight:400;letter-spacing:.12em;margin:16px 0 10px}.tag{font-size:11px;color:var(--accent);margin:0 0 13px}.description{font:12px/1.95 system-ui,sans-serif;color:var(--muted);min-height:72px;margin:0 0 20px}.card-links{border-top:1px solid var(--line);padding-top:13px;display:flex;justify-content:space-between;gap:10px;font:11px system-ui,sans-serif}.detail{border:0;padding:0;background:none;font:inherit}.card-links a{font:inherit;color:var(--muted)}footer{border-top:1px solid var(--line);padding-top:19px;margin-top:36px;display:flex;justify-content:space-between;gap:20px;font:11px/1.8 system-ui,sans-serif;color:var(--muted)}dialog{background:var(--ground);color:var(--ink);border:1px solid var(--line);width:min(890px,calc(100vw - 28px));max-height:95svh;padding:20px 28px}dialog::backdrop{background:#000b;backdrop-filter:blur(8px)}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:20px}.modal-head h2{margin:0;font-size:20px}.close{background:none;border:0;font-size:23px;color:var(--muted)}.full{display:block;width:100%;height:70svh;object-fit:contain;padding:16px 0}.modal-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:15px}.modal-foot button{background:none;border:0;font:12px system-ui,sans-serif}.modal-foot span{font:11px Georgia;color:var(--muted)}@media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.art img{height:280px}.description{min-height:70px}}@media(max-width:650px){main{padding:28px 6vw}header{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr;gap:30px}.art img{height:360px}h2{margin-top:0}.description{min-height:0}footer{flex-direction:column}.full{height:63svh}dialog{padding:18px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body><main>
  <header><div><p class="eyebrow">ORLANIA / BUREAU OF UNCONVENTIONAL AFFAIRS</p><h1>非常规事务署 · 纹章提案</h1><p class="intro">维多利亚式国家纹章 · 哥特奇幻 · 秘密行政机构</p></div><div class="tools"><button class="theme" type="button" aria-pressed="false">切换浅色底</button><a href="/unconventional-affairs.html">返回详情页 ↗</a></div></header>
  <section class="grid" aria-label="五版纹章对照"></section>
  <footer><span>点击纹章放大查看 · 可下载透明底 PNG 原图</span><span>概念提案 / 饰带文字暂留白</span></footer>
</main>
<dialog aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title"></h2><button class="close" aria-label="关闭大图" type="button">×</button></div><img class="full" alt=""><div class="modal-foot"><button class="previous" type="button">← 上一版</button><span class="counter"></span><button class="next" type="button">下一版 →</button></div></dialog>
<script type="module">
  const concepts=[
    ['01-sealed-gate','封门敕令','王室特许 / 封锁与收容','龙与独角兽扶盾，中央门扉被锁链与封蜡约束。最接近具有王室特许权的正式中央机关。'],
    ['02-iron-key','禁钥典守','禁区权限 / 知识守护','双独角兽守护黑铁钥匙，灯盏位于顶端。强调进入禁区、保管秘密与守护档案的权限。'],
    ['03-griffin-mandate','鹰狮钦令','中央执法 / 警戒与处置','单体狮鹫展开双翼，握持权杖和锁链，盾中是守望之塔。轮廓最鲜明，执法气质最强。'],
    ['04-raven-archive','无名密档','秘密调查 / 无法归档之物','双鸦、提灯、封闭书册与无名门。银黑色为主，更像一个掌握太多秘密的古老部门。'],
    ['05-bound-eye','缄视之章','异常监管 / 约束未知','双龙环护椭圆盾，一只眼被金环与红色封印束缚。以制度约束不可理解之物，秘仪感最强。'],
  ];
  const grid=document.querySelector('.grid');
  const modal=document.querySelector('dialog');
  const source=i=>`/unconventional-affairs/crests-v1/${concepts[i][0]}.png`;
  let selected=0;
  function show(i){selected=(i+concepts.length)%concepts.length;const c=concepts[selected];modal.querySelector('h2').textContent=c[1];modal.querySelector('img').src=source(selected);modal.querySelector('img').alt=c[1]+'纹章';modal.querySelector('.counter').textContent=`0${selected+1} / 05`;if(!modal.open)modal.showModal()}
  concepts.forEach((c,i)=>{const card=document.createElement('article');card.innerHTML=`<span class="number">0${i+1} / PROPOSAL</span><button class="art" aria-label="放大${c[1]}"><img src="${source(i)}" alt="${c[1]}纹章" width="1254" height="1254" decoding="async"></button><h2>${c[1]}</h2><p class="tag">${c[2]}</p><p class="description">${c[3]}</p><div class="card-links"><button class="detail" type="button">放大细看 ↗</button><a href="${source(i)}" download="${c[0]}.png">原图 ↓</a></div>`;card.querySelector('.art').onclick=card.querySelector('.detail').onclick=()=>show(i);grid.append(card)});
  document.querySelector('.theme').onclick=function(){const light=document.body.classList.toggle('paper');this.setAttribute('aria-pressed',light);this.textContent=light?'切换深色底':'切换浅色底'};
  modal.querySelector('.close').onclick=()=>modal.close();
  modal.querySelector('.previous').onclick=()=>show(selected-1);
  modal.querySelector('.next').onclick=()=>show(selected+1);
  modal.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();show(selected-1)}if(e.key==='ArrowRight'){e.preventDefault();show(selected+1)}});
  modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}});
</script></body></html>
