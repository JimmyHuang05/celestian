name: Supabase Keepalive
on:
  schedule:
    - cron: '0 0 */6 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase entries API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://qunhjfulchaurfxtjoeg.supabase.co/rest/v1/entries?limit=1" \
            -H "apikey: sb_publishable_Nkbcb5N92HUqJAGB9TYnJQ_W_09BC-T")
          echo "Supabase responded with status: $STATUS"
          if [ "$STATUS" != "200" ]; then exit 1; fi
